// Gargantua System — configurações do usuário
// Edite com o jogo fechado. Mudar estes valores com um save em andamento pode mover ou destruir naves no sistema:
// faça backup do save antes (naves em órbita de um corpo que deixa de existir são apagadas ao carregar).

GargantuaSystemSettings
{
	// Wormhole ligando o sistema Kerbol (perto de Jool; Sarnus com OPM; Saturno com RSS/KSRSS) a Gargantua.
	// Precisa do KopernicusExpansion. Desligado automaticamente com Principia.
	// True (padrão) ou False.
	Wormholes = True

	// Distância entre Kerbol e Gargantua (padrão 2.0E14 m).
	// 1 (padrão), 0.1, 10, 100.
	// 0 = Kerbol orbita Gargantua a 5.0E12 m (EXPERIMENTAL; forçado com Principia).
	DistanceFactor = 1

	// True desliga a skybox do mod (só existe com a SigmaReplacements-SkyBox instalada).
	// Com Principia a skybox fica preta de qualquer jeito.
	DisableSkybox = False
}

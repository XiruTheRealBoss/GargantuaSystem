// Gargantua System — configurações do usuário
// Edite com o jogo fechado. Mudar estes valores com um save em andamento pode mover ou destruir naves no sistema.

GargantuaSystemSettings
{
	// Wormhole ligando o sistema Kerbol ao Gargantua (precisa do KopernicusExpansion).
	// True (padrão) ou False.
	Wormholes = True

	// Distância entre Kerbol e Gargantua (padrão 200 Tm).
	// 1 (padrão), 0.1, 10, 100.
	// 0 = Kerbol orbita Gargantua (forçado com Principia).
	DistanceFactor = 1

	// True desliga o skybox do mod. Com Principia o skybox fica preto de qualquer jeito.
	DisableSkybox = False
}

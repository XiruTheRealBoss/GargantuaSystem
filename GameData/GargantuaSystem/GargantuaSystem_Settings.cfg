// Gargantua System — user settings
// Edit with the game closed. Changing these values on a save in progress can move or destroy vessels in the system:
// back up the save first (vessels orbiting a body that stops existing are deleted on load).

GargantuaSystemSettings
{
	// Wormhole linking the Kerbol system (near Jool; Sarnus with OPM; Saturn with RSS/KSRSS) to Gargantua.
	// Needs KopernicusExpansion. Turned off automatically with Principia.
	// True (default) or False.
	Wormholes = True

	// Distance between Kerbol and Gargantua (default 2.0E14 m).
	// 1 (default), 0.1, 10, 100.
	// 0 = Kerbol orbits Gargantua at 5.0E12 m (EXPERIMENTAL; forced with Principia).
	DistanceFactor = 1

	// True turns off the mod's skybox (it only exists with SigmaReplacements-SkyBox installed).
	// With Principia the skybox is black anyway.
	DisableSkybox = False
}

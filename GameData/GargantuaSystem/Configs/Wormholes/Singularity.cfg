// Visual dos wormholes (o Singularity só desenha; quem teleporta é o KopernicusExpansion).
// O setting é injetado no nó do Gargantua e o par de objetos só é criado se Wormholes != False.
@Singularity:HAS[@Singularity_object[Gargantua]]:BEFORE[GargantuaSystem]
{
	#@GargantuaSystemSettings {}
}
@Singularity:HAS[@Singularity_object[Gargantua],@GargantuaSystemSettings:HAS[~Wormholes[?alse]]]:FOR[GargantuaSystem]:NEEDS[KopernicusExpansion]
{
	Singularity_object
	{
		name = GargSysWormholeA
		// raio visual ≈ sqrt(gravity) * 30 km
		gravity = 0.6
		hideCelestialBody = True
		useAccretionDisk = False
		wormholeTarget = GargSysWormholeB
		scaleEnclosingMesh = 0.6
	}
	Singularity_object
	{
		name = GargSysWormholeB
		gravity = 0.6
		hideCelestialBody = True
		useAccretionDisk = False
		wormholeTarget = GargSysWormholeA
		scaleEnclosingMesh = 0.6
	}
}
@Singularity:HAS[@GargantuaSystemSettings]:FINAL
{
	!GargantuaSystemSettings {}
}

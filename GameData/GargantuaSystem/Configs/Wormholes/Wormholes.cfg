// Wormhole linking the Kerbol system to Gargantua (like the film's, near Saturn; here near Jool).
// Teleport: KopernicusExpansion's Wormhole{} node (KEX-Wormholes). Visuals: Singularity (Configs/Wormholes/Singularity.cfg).
// Can be turned off in GargantuaSystem_Settings.cfg (Wormholes = False). Without KopernicusExpansion the bodies are not even created.
//
// Mouth A: around Jool, beyond Pol (6E8 m). With OPM it moves to Sarnus; with RSS/KSRSS to Saturn (Compat/).
// Mouth B: around Gargantua at 1.5E11 m (~44 km/s to Miller).
// The body has a 10 km radius, but the surface is sunk to ~1 km from the centre (VertexHeightMap with negative offset):
// the vessel enters the jump zone (jumpMaxAltitude) long before it could hit anything.
@Kopernicus:FOR[GargantuaSystem]:HAS[@GargantuaSystemSettings:HAS[~Wormholes[?alse]]]:NEEDS[KopernicusExpansion]
{
	Body
	{
		name = GargSysWormholeA
		identifier = GargantuaSystem/WormholeA
		cacheFile = GargantuaSystem/Cache/WormholeA.bin
		Tag = GargSys
		Template
		{
			name = Minmus
			removeAllPQSMods = true
		}
		Properties
		{
			displayName = #LOC_GargSys_WormholeA_name
			description = #LOC_GargSys_Wormhole_desc
			radius = 10000
			geeASL = 1
			tidallyLocked = false
			rotationPeriod = 60000
			timewarpAltitudeLimits = 0 0 0 0 0 0 0 0
			maxZoom = 60000
			ScienceValues
			{
				landedDataValue = 1
				splashedDataValue = 1
				flyingLowDataValue = 1
				flyingHighDataValue = 1
				inSpaceLowDataValue = 25
				inSpaceHighDataValue = 12
				recoveryValue = 15
				flyingAltitudeThreshold = 20000
				spaceAltitudeThreshold = 60000
			}
			biomeMap = GargantuaSystem/Textures/Black.png
			Biomes
			{
				Biome
				{
					name = Throat
					displayName = #LOC_GargSys_Biome_Throat
					value = 1
					color = #000000
				}
			}
		}
		Wormhole
		{
			partner = GargSysWormholeB
			influenceAltitude = 35000
			jumpMaxAltitude = 30000
			jumpMinAltitude = 10
			exitMessage = #LOC_GargSys_WormholeExit
			exitMsgDuration = 10
			heatRate = 0.01
		}
		Orbit
		{
			referenceBody = Jool
			semiMajorAxis = 6.0E8
			eccentricity = 0
			inclination = 12
			longitudeOfAscendingNode = 30
			argumentOfPeriapsis = 0
			meanAnomalyAtEpoch = 1
			epoch = 0
			color = 0.35,0.35,0.40,1
		}
		ScaledVersion
		{
			type = Vacuum
			fadeStart = 7000
			fadeEnd = 10000
			OnDemand
			{
				texture = GargantuaSystem/Textures/Black.png
			}
			Material
			{
				color = 0,0,0,1
				specColor = 0,0,0,1
				shininess = 0
			}
		}
		PQS
		{
			Mods
			{
				VertexHeightMap
				{
					map = GargantuaSystem/Textures/Black.png
					offset = -9000
					deformity = 0
					scaleDeformityByRadius = false
					order = 10
					enabled = true
				}
				VertexColorMap
				{
					map = GargantuaSystem/Textures/Black.png
					order = 90
					enabled = true
				}
			}
		}
	}
}

// Mouth B = copy of A with another name, partner and orbit (separate patch in the same pass: runs after the one above)
@Kopernicus:FOR[GargantuaSystem]:HAS[@GargantuaSystemSettings:HAS[~Wormholes[?alse]]]:NEEDS[KopernicusExpansion]
{
	+Body[GargSysWormholeA]
	{
		@name = GargSysWormholeB
		@identifier = GargantuaSystem/WormholeB
		@cacheFile = GargantuaSystem/Cache/WormholeB.bin
		@Properties
		{
			@displayName = #LOC_GargSys_WormholeB_name
		}
		@Wormhole
		{
			@partner = GargSysWormholeA
		}
		!Orbit {}
		Orbit
		{
			referenceBody = Gargantua
			semiMajorAxis = 1.5E11
			eccentricity = 0
			inclination = 2
			longitudeOfAscendingNode = 0
			argumentOfPeriapsis = 0
			meanAnomalyAtEpoch = 0
			epoch = 0
			color = 0.35,0.35,0.40,1
		}
	}
}

// OPM: mouth A moves to Sarnus (OPM's "Saturn"), like the film
@Kopernicus:AFTER[GargantuaSystem]:NEEDS[OPM,!RealSolarSystem,!KSRSS]
{
	@Body[GargSysWormholeA]
	{
		@Orbit
		{
			@referenceBody = Sarnus
			@semiMajorAxis = 1.2E8
		}
	}
}

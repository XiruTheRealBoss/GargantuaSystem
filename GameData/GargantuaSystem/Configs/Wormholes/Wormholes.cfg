// Wormhole ligando o sistema Kerbol a Gargantua (como o do filme, perto de Saturno; aqui perto de Jool).
// Teleporte: nó Wormhole{} do KopernicusExpansion (KEX-Wormholes). Visual: Singularity (Configs/Wormholes/Singularity.cfg).
// Desligável em GargantuaSystem_Settings.cfg (Wormholes = False). Sem o KopernicusExpansion os corpos nem são criados.
//
// Boca A: em volta de Jool, além de Pol (6E8 m). Com OPM vai para Sarnus; com RSS/KSRSS para Saturno (Compat/).
// Boca B: em volta de Gargantua a 1.5E11 m (~44 km/s até Miller; ver PLAN.md).
// O corpo tem 10 km de raio, mas a superfície fica afundada a ~1 km do centro (VertexHeightMap com offset negativo):
// a nave entra na zona de salto (jumpMaxAltitude) muito antes de poder bater em alguma coisa.
@Kopernicus:FOR[GargantuaSystem]:HAS[@GargantuaSystemSettings:HAS[~Wormholes[?alse]]]:NEEDS[KopernicusExpansion]
{
	Body
	{
		name = GargSysWormholeA
		identifier = GargantuaSystem/WormholeA
		cacheFile = GargantuaSystem/Cache/WormholeA.bin
		Tag = GargSys
		Template
		{
			name = Minmus
			removeAllPQSMods = true
		}
		Properties
		{
			displayName = #LOC_GargSys_WormholeA_name
			description = #LOC_GargSys_Wormhole_desc
			radius = 10000
			geeASL = 1
			tidallyLocked = false
			rotationPeriod = 60000
			timewarpAltitudeLimits = 0 0 0 0 0 0 0 0
			maxZoom = 60000
			ScienceValues
			{
				landedDataValue = 1
				splashedDataValue = 1
				flyingLowDataValue = 1
				flyingHighDataValue = 1
				inSpaceLowDataValue = 25
				inSpaceHighDataValue = 12
				recoveryValue = 15
				flyingAltitudeThreshold = 20000
				spaceAltitudeThreshold = 60000
			}
			biomeMap = GargantuaSystem/Textures/Black.png
			Biomes
			{
				Biome
				{
					name = Throat
					displayName = #LOC_GargSys_Biome_Throat
					value = 1
					color = #000000
				}
			}
		}
		Wormhole
		{
			partner = GargSysWormholeB
			influenceAltitude = 35000
			jumpMaxAltitude = 30000
			jumpMinAltitude = 10
			entryMessage = #LOC_GargSys_WormholeEntry
			exitMessage = #LOC_GargSys_WormholeExit
			entryMsgDuration = 15
			exitMsgDuration = 10
			heatRate = 0.01
		}
		Orbit
		{
			referenceBody = Jool
			semiMajorAxis = 6.0E8
			eccentricity = 0
			inclination = 12
			longitudeOfAscendingNode = 30
			argumentOfPeriapsis = 0
			meanAnomalyAtEpoch = 1
			epoch = 0
			color = 0.35,0.35,0.40,1
		}
		ScaledVersion
		{
			type = Vacuum
			fadeStart = 7000
			fadeEnd = 10000
			OnDemand
			{
				texture = GargantuaSystem/Textures/Black.png
			}
			Material
			{
				color = 0,0,0,1
				specColor = 0,0,0,1
				shininess = 0
			}
		}
		PQS
		{
			Mods
			{
				VertexHeightMap
				{
					map = GargantuaSystem/Textures/Black.png
					offset = -9000
					deformity = 0
					scaleDeformityByRadius = false
					order = 10
					enabled = true
				}
				VertexColorMap
				{
					map = GargantuaSystem/Textures/Black.png
					order = 90
					enabled = true
				}
			}
		}
	}
	Body
	{
		name = GargSysWormholeB
		identifier = GargantuaSystem/WormholeB
		cacheFile = GargantuaSystem/Cache/WormholeB.bin
		Tag = GargSys
		Template
		{
			name = Minmus
			removeAllPQSMods = true
		}
		Properties
		{
			displayName = #LOC_GargSys_WormholeB_name
			description = #LOC_GargSys_Wormhole_desc
			radius = 10000
			geeASL = 1
			tidallyLocked = false
			rotationPeriod = 60000
			timewarpAltitudeLimits = 0 0 0 0 0 0 0 0
			maxZoom = 60000
			ScienceValues
			{
				landedDataValue = 1
				splashedDataValue = 1
				flyingLowDataValue = 1
				flyingHighDataValue = 1
				inSpaceLowDataValue = 25
				inSpaceHighDataValue = 12
				recoveryValue = 15
				flyingAltitudeThreshold = 20000
				spaceAltitudeThreshold = 60000
			}
			biomeMap = GargantuaSystem/Textures/Black.png
			Biomes
			{
				Biome
				{
					name = Throat
					displayName = #LOC_GargSys_Biome_Throat
					value = 1
					color = #000000
				}
			}
		}
		Wormhole
		{
			partner = GargSysWormholeA
			influenceAltitude = 35000
			jumpMaxAltitude = 30000
			jumpMinAltitude = 10
			entryMessage = #LOC_GargSys_WormholeEntry
			exitMessage = #LOC_GargSys_WormholeExit
			entryMsgDuration = 15
			exitMsgDuration = 10
			heatRate = 0.01
		}
		Orbit
		{
			referenceBody = Gargantua
			semiMajorAxis = 1.5E11
			eccentricity = 0
			inclination = 2
			longitudeOfAscendingNode = 0
			argumentOfPeriapsis = 0
			meanAnomalyAtEpoch = 0
			epoch = 0
			color = 0.35,0.35,0.40,1
		}
		ScaledVersion
		{
			type = Vacuum
			fadeStart = 7000
			fadeEnd = 10000
			OnDemand
			{
				texture = GargantuaSystem/Textures/Black.png
			}
			Material
			{
				color = 0,0,0,1
				specColor = 0,0,0,1
				shininess = 0
			}
		}
		PQS
		{
			Mods
			{
				VertexHeightMap
				{
					map = GargantuaSystem/Textures/Black.png
					offset = -9000
					deformity = 0
					scaleDeformityByRadius = false
					order = 10
					enabled = true
				}
				VertexColorMap
				{
					map = GargantuaSystem/Textures/Black.png
					order = 90
					enabled = true
				}
			}
		}
	}
}

// OPM: a boca A vai para Sarnus (o "Saturno" do OPM), como no filme
@Kopernicus:AFTER[GargantuaSystem]:NEEDS[OPM,!RealSolarSystem,!KSRSS]
{
	@Body[GargSysWormholeA]
	{
		@Orbit
		{
			@referenceBody = Sarnus
			@semiMajorAxis = 1.2E8
		}
	}
}

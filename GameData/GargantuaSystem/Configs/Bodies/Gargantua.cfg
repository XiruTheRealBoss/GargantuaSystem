// Gargantua — buraco negro supermassivo (escala Kerbal; ver README "Aproximações").
// O livro dá >= 1E8 massas solares. Aqui são 1.0E31 kg (~570 Kerbols) para Miller ser alcançável.
// O corpo é uma "estrela" invisível: o Singularity esconde o ScaledVersion e desenha horizonte + disco.
// Orbita o Kerbol (que continua sendo o corpo raiz) com mode = OFF: sem linha de órbita, sem trocar a raiz.
@Kopernicus:FOR[GargantuaSystem]
{
	Body
	{
		name = Gargantua
		identifier = GargantuaSystem/Gargantua
		finalizeOrbit = false
		Template
		{
			name = Sun
		}
		Properties
		{
			displayName = #LOC_GargSys_Gargantua_name
			description = #LOC_GargSys_Gargantua_desc
			radius = 2.8E9
			mass = 1.0E31
			// SOI explícito: com massa > Kerbol, a fórmula automática daria um SOI maior que a própria órbita.
			sphereOfInfluence = 1.5E13
			maxZoom = 1.5E10
			timewarpAltitudeLimits = 0 1.0E9 2.0E9 3.0E9 5.0E9 8.0E9 1.2E10 2.0E10
			ScienceValues
			{
				flyingLowDataValue = 1
				flyingHighDataValue = 1
				inSpaceLowDataValue = 40
				inSpaceHighDataValue = 15
				recoveryValue = 20
				flyingAltitudeThreshold = 1.0E9
				spaceAltitudeThreshold = 2.0E10
			}
		}
		Orbit
		{
			referenceBody = Sun
			semiMajorAxis = 2.0E14
			eccentricity = 0
			inclination = 25
			longitudeOfAscendingNode = 60
			argumentOfPeriapsis = 0
			meanAnomalyAtEpoch = 0
			epoch = 0
			mode = OFF
			color = 0,0,0,0
		}
		// Calor letal perto do horizonte e do disco interno, para ninguém "pousar" no corpo.
		HazardousBody
		{
			Item
			{
				ambientTemp = 6000
				AltitudeCurve
				{
					key = 0 1
					key = 1.0E9 0.6
					key = 5.0E9 0.1
					key = 1.2E10 0
				}
			}
		}
		ScaledVersion
		{
			type = Star
			Light
			{
				sunlightColor = 1,0.96,0.88,1
				scaledSunlightColor = 1,0.96,0.88,1
				IVASunColor = 1,0.96,0.88,1
				sunLensFlareColor = 0,0,0,1
				// Fluxo igual ao de Kerbin a 1.5E10 m (órbita de referência perto de Miller).
				luminosity = 1360
				sunAU = 1.5E10
				IntensityCurve
				{
					key = 0 1.6
					key = 1.5E10 1
					key = 6.0E10 0.5
					key = 3.0E11 0.1
					key = 1.0E12 0
				}
				ScaledIntensityCurve
				{
					key = 0 1.6
					key = 2.5E6 1
					key = 1.0E7 0.5
					key = 5.0E7 0.1
					key = 1.67E8 0
				}
				IVAIntensityCurve
				{
					key = 0 1.6
					key = 1.5E10 1
					key = 6.0E10 0.5
					key = 3.0E11 0.1
					key = 1.0E12 0
				}
			}
			Material
			{
				emitColor0 = 0,0,0,1
				emitColor1 = 0,0,0,1
				sunspotColor = 0,0,0,1
				rimColor = 0,0,0,1
			}
			Coronas
			{
				Corona
				{
					Material
					{
						texture = GargantuaSystem/Textures/Black.png
					}
				}
			}
		}
	}
}

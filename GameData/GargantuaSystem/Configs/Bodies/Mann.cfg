// Mann — grey-white crumpled glacier with crevasses and streaks of volcanic ash (the film was shot on the
// Svinafellsjokull glacier, Iceland). The film has "frozen clouds".
// Thin atmosphere inherited from the Duna template (not breathable). Clouds come from EVE (patch with :NEEDS).
// 80% gravity and 500 km radius: creative liberty (see README).
@Kopernicus:FOR[GargantuaSystem]
{
	Body
	{
		name = Mann
		identifier = GargantuaSystem/Mann
		cacheFile = GargantuaSystem/Cache/Mann.bin
		Template
		{
			name = Duna
			removeAllPQSMods = true
		}
		Properties
		{
			displayName = #LOC_GargSys_Mann_name
			description = #LOC_GargSys_Mann_desc
			radius = 500000
			geeASL = 0.8
			rotationPeriod = 41000
			initialRotation = 0
			timewarpAltitudeLimits = 0 50000 50000 50000 100000 200000 400000 800000
			ScienceValues
			{
				landedDataValue = 16
				splashedDataValue = 1
				flyingLowDataValue = 13
				flyingHighDataValue = 11
				inSpaceLowDataValue = 10
				inSpaceHighDataValue = 8
				recoveryValue = 12
				flyingAltitudeThreshold = 12000
				spaceAltitudeThreshold = 300000
			}
			biomeMap = GargantuaSystem/PluginData/Mann/Mann_biomes.png
			Biomes
			{
				Biome
				{
					name = IcePlains
					displayName = #LOC_GargSys_Biome_IcePlains
					value = 1
					color = #DDE8F0
				}
				Biome
				{
					name = PressureRidges
					displayName = #LOC_GargSys_Biome_PressureRidges
					value = 1.4
					color = #9FB7CC
				}
				Biome
				{
					name = CrevasseFields
					displayName = #LOC_GargSys_Biome_CrevasseFields
					value = 1.8
					color = #4C6680
				}
				Biome
				{
					name = FrozenHighlands
					displayName = #LOC_GargSys_Biome_FrozenHighlands
					value = 1.5
					color = #FFFFFF
				}
				Biome
				{
					name = Poles
					displayName = #LOC_GargSys_Biome_Poles
					value = 1.3
					color = #B8D4E8
				}
			}
		}
		Orbit
		{
			referenceBody = Gargantua
			semiMajorAxis = 7.0E10
			eccentricity = 0.03
			inclination = 3
			longitudeOfAscendingNode = 40
			argumentOfPeriapsis = 10
			meanAnomalyAtEpoch = 2
			epoch = 0
			color = 0.75,0.85,0.95,1
		}
		Atmosphere
		{
			oxygen = false
			ambientColor = 0.07,0.07,0.08,1
			lightColor = 0.85,0.86,0.88,1
			// almost white overcast sky, like the film (the Duna template would make it red)
			AtmosphereFromGround
			{
				waveLength = 0.62,0.61,0.60,0.5
			}
		}
		ScaledVersion
		{
			type = Atmospheric
			OnDemand
			{
				texture = GargantuaSystem/PluginData/Mann/Mann_color.png
				normals = GargantuaSystem/PluginData/Mann/Mann_normal.png
			}
		}
		PQS
		{
			// Triplanar without a texture array: the vertex colour (VertexColorMap) tints the detail textures.
			// The 1.12 Kerbin template default (TriplanarAtlas) reads vertex colour as blend weights -> white terrain.
			materialType = AtmosphericTriplanarZoomRotation
			// KSP's own detail textures (BUILTIN), tinted by the vertex colour of the planet map.
			Material
			{
				factor = 7.5
				factorBlendWidth = 0.05
				factorRotation = 135
				saturation = 1.0
				contrast = 1.2
				tintColor = 1,1,1,0
				specularColor = 0.20,0.22,0.25,0.45
				albedoBrightness = 1
				steepPower = 2.5
				steepTexStart = 12500
				steepTexEnd = 36500
				steepTex = BUILTIN/EelooSteep_Diffuse
				steepBumpMap = BUILTIN/EelooSteep_Normal
				steepNearTiling = 100
				steepTiling = 50
				lowTex = BUILTIN/laytheSnow_diff
				lowTiling = 38000
				midTex = BUILTIN/EelooHighQuality-Mid_Diffuse
				midTiling = 38000
				midBumpMap = BUILTIN/EelooHighQuality-Mid_Normal
				midBumpTiling = 38000
				highTex = BUILTIN/laytheSnow_diff
				highTiling = 38000
				lowStart = 0
				lowEnd = 0.3
				highStart = 0.6
				highEnd = 0.8
				globalDensity = -5E-06
				fogColorRamp = BUILTIN/blue_atmogradient
				planetOpacity = 0
				oceanFogDistance = 1000
			}
			Mods
			{
				// Fog/atmosphere parameters of the PQS material. removeAllPQSMods removes the template's one, and without it
				// the terrain renders all white or all black in flight view.
				AerialPerspectiveMaterial
				{
					atmosphereDepth = 50000
					DEBUG_SetEveryFrame = True
					globalDensity = -1E-05
					heightFalloff = 6.75
					oceanDepth = 0
					order = 101
					enabled = True
				}
				// Map: 0 = -800 m, 1 = +5200 m
				// 16-bit (KopernicusExpansion): with 8 bits the relief came out in ~24 m steps
				VertexHeightMap16
				{
					map = GargantuaSystem/PluginData/Mann/Mann_height.png
					offset = -800
					deformity = 6000
					scaleDeformityByRadius = false
					order = 20
					enabled = true
				}
				VertexSimplexHeightAbsolute
				{
					// crumpled ice at a 1-2 km scale (the film's glacier), on top of the heightmap
					deformity = 220
					frequency = 300
					octaves = 8
					persistence = 0.55
					seed = 1313
					order = 21
					enabled = true
				}
				VertexColorMap
				{
					// 8K DDS: the terrain colour texture (the 4K PNG is for the view from space)
					map = GargantuaSystem/PluginData/Mann/Mann_color.dds
					order = 500
					enabled = true
				}
			}
		}
	}
}

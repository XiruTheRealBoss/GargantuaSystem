// Miller — tidally locked ocean planet, very close to Gargantua.
// Shallow ocean (~3 m, "knee-deep"). The giant tidal waves (~1.2 km) sweep the planet: they are not
// terrain, they are meshes the GargantuaWaves.dll plugin (src/GargantuaWaves) moves around Miller.
// 130% gravity and 650 km radius: creative liberty (the film gives no reliable numbers; see README).
@Kopernicus:FOR[GargantuaSystem]
{
	Body
	{
		name = Miller
		identifier = GargantuaSystem/Miller
		cacheFile = GargantuaSystem/Cache/Miller.bin
		Template
		{
			name = Kerbin
			removeAllPQSMods = true
		}
		Properties
		{
			displayName = #LOC_GargSys_Miller_name
			description = #LOC_GargSys_Miller_desc
			radius = 650000
			geeASL = 1.3
			tidallyLocked = true
			timewarpAltitudeLimits = 0 70000 70000 70000 140000 280000 560000 1120000
			ScienceValues
			{
				landedDataValue = 18
				splashedDataValue = 18
				flyingLowDataValue = 15
				flyingHighDataValue = 12
				inSpaceLowDataValue = 12
				inSpaceHighDataValue = 9
				recoveryValue = 14
				flyingAltitudeThreshold = 18000
				spaceAltitudeThreshold = 400000
			}
			biomeMap = GargantuaSystem/PluginData/Miller/Miller_biomes.png
			Biomes
			{
				Biome
				{
					name = Shallows
					displayName = #LOC_GargSys_Biome_Shallows
					value = 1
					color = #2E6F8E
				}
				Biome
				{
					name = PolarShallows
					displayName = #LOC_GargSys_Biome_PolarShallows
					value = 1.2
					color = #1B3A4B
				}
			}
		}
		Orbit
		{
			referenceBody = Gargantua
			semiMajorAxis = 1.0E10
			eccentricity = 0
			inclination = 1.5
			longitudeOfAscendingNode = 0
			argumentOfPeriapsis = 0
			meanAnomalyAtEpoch = 0
			epoch = 0
			color = 0.30,0.60,0.75,1
		}
		// Film water: shallow, grey-green, reflecting an overcast sky.
		// removeAllPQSMods also removes the PQSMod_OceanFX inherited from Kerbin; it is re-added below with
		// KSP's own animated textures (sea-water1..8), otherwise the water is static and untextured.
		Ocean
		{
			ocean = true
			oceanColor = 0.20,0.23,0.22,1
			density = 1
			Material
			{
				color = 0.30,0.32,0.31,1
				colorFromSpace = 0.20,0.23,0.22,1
				specColor = 1,1,1,1
				shininess = 0.7
				gloss = 0.35
				tiling = 1000
				waterTex = BUILTIN/sea-water1
				waterTex1 = BUILTIN/sea-water2
				bTiling = 800
				bumpMap = BUILTIN/quiet
				displacement = 0.05
				texDisplacement = -0.31
				dispFreq = 0.15
				mix = 0.37
				// shallow sea: more transparent than Kerbin's, shows the bottom
				oceanOpacity = 0.55
				falloffPower = 1.1
				falloffExp = 2
				fogColor = 0.78,0.80,0.80,1
				heightFallOff = 0.2
				globalDensity = -8E-06
				atmosphereDepth = 70000
				fogColorRamp = BUILTIN/AerialRampKerbin2
				fadeStart = 20000
				fadeEnd = 60000
				planetOpacity = 1
				normalXYFudge = 1.4
				normalZFudge = 1.18
			}
			Fog
			{
				useFog = True
				fogColorStart = 0.16,0.20,0.19,1
				fogColorEnd = 0.05,0.07,0.07,1
				fogDensityStart = 0.01
				fogDensityEnd = 0.04
				fogDensityExponent = 1
				fogDensityPQSMult = 0.02
				fogDensityAltScalar = -0.0008
				afgAltMult = 0.05
				afgBase = 0.6
				afgLerp = False
				afgMin = 0.05
				skyColorMult = 1.1
				skyColorOpacityAltMult = 15
				skyColorOpacityBase = 0.25
				sunAltMult = 0.01
				sunBase = 0.5
				sunMin = 0.05
			}
			Mods
			{
				OceanFX
				{
					framesPerSecond = 10
					order = 100
					enabled = True
					Watermain
					{
						value = BUILTIN/sea-water1
						value = BUILTIN/sea-water2
						value = BUILTIN/sea-water3
						value = BUILTIN/sea-water4
						value = BUILTIN/sea-water5
						value = BUILTIN/sea-water6
						value = BUILTIN/sea-water7
						value = BUILTIN/sea-water8
					}
				}
			}
		}
		// Unbreathable air: the film's crew kept their helmets on (creative liberty).
		Atmosphere
		{
			oxygen = false
			// overcast blue-grey sky, like the film (less saturated than Kerbin's)
			ambientColor = 0.07,0.08,0.09,1
			lightColor = 0.80,0.84,0.86,1
			AtmosphereFromGround
			{
				waveLength = 0.63,0.60,0.57,0.5
			}
		}
		ScaledVersion
		{
			type = Atmospheric
			OnDemand
			{
				texture = GargantuaSystem/PluginData/Miller/Miller_color.png
			}
		}
		PQS
		{
			// Triplanar without a texture array: the vertex colour (VertexColorMap) tints the detail textures.
			// The 1.12 Kerbin template default (TriplanarAtlas) reads vertex colour as blend weights -> white terrain.
			materialType = AtmosphericTriplanarZoomRotation
			// KSP's own detail textures (BUILTIN), tinted by the vertex colour of the planet map.
			Material
			{
				factor = 7.5
				factorBlendWidth = 0.05
				factorRotation = 135
				saturation = 0.9
				contrast = 1.1
				tintColor = 1,1,1,0
				specularColor = 0.35,0.40,0.42,0.7
				albedoBrightness = 1
				steepPower = 2.5
				steepTexStart = 12500
				steepTexEnd = 36500
				steepTex = BUILTIN/sea-water3
				steepBumpMap = BUILTIN/quiet
				steepNearTiling = 100
				steepTiling = 50
				lowTex = BUILTIN/sea-water1
				lowTiling = 38000
				midTex = BUILTIN/sea-water2
				midTiling = 38000
				midBumpMap = BUILTIN/quiet
				midBumpTiling = 38000
				highTex = BUILTIN/sea-water1
				highTiling = 38000
				lowStart = 0
				lowEnd = 0.2
				highStart = 0.7
				highEnd = 0.9
				globalDensity = -5E-06
				fogColorRamp = BUILTIN/blue_atmogradient
				planetOpacity = 0
				oceanFogDistance = 1000
			}
			Mods
			{
				// Fog/atmosphere parameters of the PQS material. removeAllPQSMods removes the template's one, and without it
				// the terrain renders all white or all black in flight view.
				AerialPerspectiveMaterial
				{
					atmosphereDepth = 70000
					DEBUG_SetEveryFrame = True
					globalDensity = -1E-05
					heightFalloff = 6.75
					oceanDepth = 0
					order = 101
					enabled = True
				}
				// flat sea floor at -3 m (the giant waves come from the plugin)
				VertexHeightOffset
				{
					offset = -3
					order = 20
					enabled = true
				}
				// Gentle undulation of the floor (+-1.2 m), always below the water surface
				VertexSimplexHeightAbsolute
				{
					deformity = 1.2
					frequency = 40
					octaves = 3
					persistence = 0.5
					seed = 4242
					order = 21
					enabled = true
				}
				VertexColorMap
				{
					map = GargantuaSystem/PluginData/Miller/Miller_color.png
					order = 500
					enabled = true
				}
			}
		}
	}
}

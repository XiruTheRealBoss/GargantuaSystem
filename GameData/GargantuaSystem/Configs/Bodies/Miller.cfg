// Miller — planeta oceânico em maré travada, muito perto de Gargantua.
// Oceano raso (~3 m, "na altura do joelho") e ondas de maré gigantes (~1,2 km), feitas como relevo ESTÁTICO.
// O oceano do KSP é plano e o Kopernicus não anima terreno; ondas móveis ficam para um plugin C# opcional.
// Gravidade 130% e raio de 650 km: liberdade criativa (o filme não dá números confiáveis; ver README).
@Kopernicus:FOR[GargantuaSystem]
{
	Body
	{
		name = Miller
		identifier = GargantuaSystem/Miller
		cacheFile = GargantuaSystem/Cache/Miller.bin
		Template
		{
			name = Kerbin
			removeAllPQSMods = true
		}
		Properties
		{
			displayName = #LOC_GargSys_Miller_name
			description = #LOC_GargSys_Miller_desc
			radius = 650000
			geeASL = 1.3
			tidallyLocked = true
			timewarpAltitudeLimits = 0 70000 70000 70000 140000 280000 560000 1120000
			ScienceValues
			{
				landedDataValue = 18
				splashedDataValue = 18
				flyingLowDataValue = 15
				flyingHighDataValue = 12
				inSpaceLowDataValue = 12
				inSpaceHighDataValue = 9
				recoveryValue = 14
				flyingAltitudeThreshold = 18000
				spaceAltitudeThreshold = 400000
			}
			biomeMap = GargantuaSystem/PluginData/Miller/Miller_biomes.png
			Biomes
			{
				Biome
				{
					name = Shallows
					displayName = #LOC_GargSys_Biome_Shallows
					value = 1
					color = #2E6F8E
				}
				Biome
				{
					name = WaveSlopes
					displayName = #LOC_GargSys_Biome_WaveSlopes
					value = 1.5
					color = #4FA3C7
				}
				Biome
				{
					name = WaveCrests
					displayName = #LOC_GargSys_Biome_WaveCrests
					value = 2
					color = #E8F4F8
				}
				Biome
				{
					name = PolarShallows
					displayName = #LOC_GargSys_Biome_PolarShallows
					value = 1.2
					color = #1B3A4B
				}
			}
		}
		Orbit
		{
			referenceBody = Gargantua
			semiMajorAxis = 1.0E10
			eccentricity = 0
			inclination = 1.5
			longitudeOfAscendingNode = 0
			argumentOfPeriapsis = 0
			meanAnomalyAtEpoch = 0
			epoch = 0
			color = 0.30,0.60,0.75,1
		}
		// Ar irrespirável: a tripulação do filme não tirou os capacetes (liberdade criativa).
		Atmosphere
		{
			oxygen = false
		}
		ScaledVersion
		{
			type = Atmospheric
			OnDemand
			{
				texture = GargantuaSystem/PluginData/Miller/Miller_color.png
				normals = GargantuaSystem/PluginData/Miller/Miller_normal.png
			}
		}
		PQS
		{
			// Triplanar sem texture array: a cor de vértice (VertexColorMap) tinge as texturas de detalhe.
			// O padrão do template Kerbin no 1.12 (TriplanarAtlas) lê a cor de vértice como peso de blend -> terreno branco.
			materialType = AtmosphericTriplanarZoomRotation
			Material
			{
				factor = 7.5
				factorBlendWidth = 0.05
				factorRotation = 135
				saturation = 1
				contrast = 1
				tintColor = 1,1,1,0
				specularColor = 0.30,0.36,0.40,0.6
				albedoBrightness = 1
				steepPower = 2.5
				steepTexStart = 12500
				steepTexEnd = 36500
				steepTex = GargantuaSystem/PluginData/Miller/Miller_detail.png
				steepBumpMap = GargantuaSystem/PluginData/Miller/Miller_detail_nrm.png
				steepNearTiling = 100
				steepTiling = 50
				lowTex = GargantuaSystem/PluginData/Miller/Miller_detail.png
				lowTiling = 38000
				midTex = GargantuaSystem/PluginData/Miller/Miller_detail.png
				midTiling = 38000
				midBumpMap = GargantuaSystem/PluginData/Miller/Miller_detail_nrm.png
				midBumpTiling = 38000
				highTex = GargantuaSystem/PluginData/Miller/Miller_detail.png
				highTiling = 38000
				lowStart = -1
				lowEnd = -1
				highStart = 2
				highEnd = 2
				globalDensity = -5E-06
				fogColorRamp = GargantuaSystem/PluginData/Miller/Miller_fogramp.png
				planetOpacity = 0
				oceanFogDistance = 1000
			}
			Mods
			{
				// Mapa: 0 = fundo do mar (-3 m), 1 = +1257 m (crista das ondas)
				VertexHeightMap
				{
					map = GargantuaSystem/PluginData/Miller/Miller_height.png
					offset = -3
					deformity = 1260
					scaleDeformityByRadius = false
					order = 20
					enabled = true
				}
				// Ondulação leve do fundo (±1,2 m), sempre abaixo da superfície da água
				VertexSimplexHeightAbsolute
				{
					deformity = 1.2
					frequency = 40
					octaves = 3
					persistence = 0.5
					seed = 4242
					order = 21
					enabled = true
				}
				VertexColorMap
				{
					map = GargantuaSystem/PluginData/Miller/Miller_color.png
					order = 500
					enabled = true
				}
			}
		}
	}
}

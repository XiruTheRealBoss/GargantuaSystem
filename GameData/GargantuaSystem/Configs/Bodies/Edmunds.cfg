// Edmunds — planície rochosa com matacões e cordilheiras serrilhadas (como na cena final do filme),
// orbitando Pantagruel (estrela de sequência principal).
// No filme é o mundo "promissor": aqui tem ar respirável (oxygen = true), herdado do template Kerbin, sem oceano.
// Gravidade 90% e raio de 600 km: liberdade criativa (ver README).
@Kopernicus:FOR[GargantuaSystem]
{
	Body
	{
		name = Edmunds
		identifier = GargantuaSystem/Edmunds
		cacheFile = GargantuaSystem/Cache/Edmunds.bin
		Template
		{
			name = Kerbin
			removeAllPQSMods = true
			removeOcean = true
		}
		Properties
		{
			displayName = #LOC_GargSys_Edmunds_name
			description = #LOC_GargSys_Edmunds_desc
			radius = 600000
			geeASL = 0.9
			rotationPeriod = 30500
			initialRotation = 90
			timewarpAltitudeLimits = 0 70000 70000 70000 140000 280000 560000 1120000
			ScienceValues
			{
				landedDataValue = 15
				splashedDataValue = 1
				flyingLowDataValue = 12
				flyingHighDataValue = 10
				inSpaceLowDataValue = 9
				inSpaceHighDataValue = 7
				recoveryValue = 12
				flyingAltitudeThreshold = 18000
				spaceAltitudeThreshold = 350000
			}
			biomeMap = GargantuaSystem/PluginData/Edmunds/Edmunds_biomes.png
			Biomes
			{
				Biome
				{
					name = RockyPlains
					displayName = #LOC_GargSys_Biome_RockyPlains
					value = 1
					color = #8C7B66
				}
				Biome
				{
					name = Mountains
					displayName = #LOC_GargSys_Biome_Mountains
					value = 1.5
					color = #4A3E34
				}
				Biome
				{
					name = SaltFlats
					displayName = #LOC_GargSys_Biome_SaltFlats
					value = 1.2
					color = #F2EEE4
				}
				Biome
				{
					name = DuneFields
					displayName = #LOC_GargSys_Biome_DuneFields
					value = 1.1
					color = #E0B070
				}
				Biome
				{
					name = Canyons
					displayName = #LOC_GargSys_Biome_Canyons
					value = 1.6
					color = #3A2418
				}
			}
		}
		Orbit
		{
			referenceBody = Pantagruel
			semiMajorAxis = 1.4E10
			eccentricity = 0.02
			inclination = 1
			longitudeOfAscendingNode = 120
			argumentOfPeriapsis = 30
			meanAnomalyAtEpoch = 1
			epoch = 0
			color = 0.85,0.65,0.40,1
		}
		Atmosphere
		{
			oxygen = true
			ambientColor = 0.10,0.07,0.04,1
			lightColor = 0.95,0.80,0.60,1
		}
		ScaledVersion
		{
			type = Atmospheric
			OnDemand
			{
				texture = GargantuaSystem/PluginData/Edmunds/Edmunds_color.png
				normals = GargantuaSystem/PluginData/Edmunds/Edmunds_normal.png
			}
		}
		PQS
		{
			// Triplanar sem texture array: a cor de vértice (VertexColorMap) tinge as texturas de detalhe.
			// O padrão do template Kerbin no 1.12 (TriplanarAtlas) lê a cor de vértice como peso de blend -> terreno branco.
			materialType = AtmosphericTriplanarZoomRotation
			// Texturas de detalhe do próprio KSP (BUILTIN), tingidas pela cor de vértice do mapa do planeta.
			Material
			{
				factor = 7.5
				factorBlendWidth = 0.05
				factorRotation = 135
				saturation = 1.1
				contrast = 1.2
				tintColor = 1,1,1,0
				specularColor = 0.04,0.04,0.04,0.2
				albedoBrightness = 1
				steepPower = 2.5
				steepTexStart = 12500
				steepTexEnd = 36500
				steepTex = BUILTIN/laythSteep_diff
				steepBumpMap = BUILTIN/laytheSteep_nrm
				steepNearTiling = 100
				steepTiling = 50
				lowTex = BUILTIN/ikeGround_diffuse
				lowTiling = 38000
				midTex = BUILTIN/MohoMid
				midTiling = 38000
				midBumpMap = BUILTIN/MohoMid_nrm
				midBumpTiling = 38000
				highTex = BUILTIN/dresHigh
				highTiling = 38000
				lowStart = 0
				lowEnd = 0.3
				highStart = 0.65
				highEnd = 0.85
				globalDensity = -5E-06
				fogColorRamp = BUILTIN/desert_atmogradient
				planetOpacity = 0
				oceanFogDistance = 1000
			}
			Mods
			{
				// Parâmetros de neblina/atmosfera do material PQS. removeAllPQSMods tira o do template, e sem ele
				// o terreno renderiza todo branco ou todo preto na vista de voo.
				AerialPerspectiveMaterial
				{
					atmosphereDepth = 70000
					DEBUG_SetEveryFrame = True
					globalDensity = -1E-05
					heightFalloff = 6.75
					oceanDepth = 0
					order = 101
					enabled = True
				}
				// Mapa: 0 = -1200 m, 1 = +5300 m
				// 16 bits (KopernicusExpansion): com 8 bits o relevo saía em degraus de ~24 m
				VertexHeightMap16
				{
					map = GargantuaSystem/PluginData/Edmunds/Edmunds_height.png
					offset = -1200
					deformity = 6500
					scaleDeformityByRadius = false
					order = 20
					enabled = true
				}
				VertexSimplexHeightAbsolute
				{
					deformity = 120
					frequency = 50
					octaves = 6
					persistence = 0.5
					seed = 777
					order = 21
					enabled = true
				}
				VertexColorMap
				{
					map = GargantuaSystem/PluginData/Edmunds/Edmunds_color.png
					order = 500
					enabled = true
				}
			}
		}
	}
}

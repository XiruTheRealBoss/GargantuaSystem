// Edmunds — deserto rochoso habitável, orbitando Pantagruel (estrela de sequência principal).
// No filme é o mundo "promissor": aqui tem ar respirável (oxygen = true), herdado do template Kerbin, sem oceano.
// Gravidade 90% e raio de 600 km: liberdade criativa (ver README).
@Kopernicus:FOR[GargantuaSystem]
{
	Body
	{
		name = Edmunds
		identifier = GargantuaSystem/Edmunds
		cacheFile = GargantuaSystem/Cache/Edmunds.bin
		Template
		{
			name = Kerbin
			removeAllPQSMods = true
			removeOcean = true
		}
		Properties
		{
			displayName = #LOC_GargSys_Edmunds_name
			description = #LOC_GargSys_Edmunds_desc
			radius = 600000
			geeASL = 0.9
			rotationPeriod = 30500
			initialRotation = 90
			timewarpAltitudeLimits = 0 70000 70000 70000 140000 280000 560000 1120000
			ScienceValues
			{
				landedDataValue = 15
				splashedDataValue = 1
				flyingLowDataValue = 12
				flyingHighDataValue = 10
				inSpaceLowDataValue = 9
				inSpaceHighDataValue = 7
				recoveryValue = 12
				flyingAltitudeThreshold = 18000
				spaceAltitudeThreshold = 350000
			}
			biomeMap = GargantuaSystem/PluginData/Edmunds/Edmunds_biomes.png
			Biomes
			{
				Biome
				{
					name = DuneSeas
					displayName = #LOC_GargSys_Biome_DuneSeas
					value = 1
					color = #E0B070
				}
				Biome
				{
					name = Mesas
					displayName = #LOC_GargSys_Biome_Mesas
					value = 1.4
					color = #8A4A2A
				}
				Biome
				{
					name = SaltFlats
					displayName = #LOC_GargSys_Biome_SaltFlats
					value = 1.2
					color = #F2EEE4
				}
				Biome
				{
					name = RockyHighlands
					displayName = #LOC_GargSys_Biome_RockyHighlands
					value = 1.1
					color = #6B5A4A
				}
				Biome
				{
					name = Canyons
					displayName = #LOC_GargSys_Biome_Canyons
					value = 1.6
					color = #3A2418
				}
			}
		}
		Orbit
		{
			referenceBody = Pantagruel
			semiMajorAxis = 1.4E10
			eccentricity = 0.02
			inclination = 1
			longitudeOfAscendingNode = 120
			argumentOfPeriapsis = 30
			meanAnomalyAtEpoch = 1
			epoch = 0
			color = 0.85,0.65,0.40,1
		}
		Atmosphere
		{
			oxygen = true
			ambientColor = 0.10,0.07,0.04,1
			lightColor = 0.95,0.80,0.60,1
		}
		ScaledVersion
		{
			type = Atmospheric
			OnDemand
			{
				texture = GargantuaSystem/PluginData/Edmunds/Edmunds_color.png
				normals = GargantuaSystem/PluginData/Edmunds/Edmunds_normal.png
			}
		}
		PQS
		{
			// Triplanar sem texture array: a cor de vértice (VertexColorMap) tinge as texturas de detalhe.
			// O padrão do template Kerbin no 1.12 (TriplanarAtlas) lê a cor de vértice como peso de blend -> terreno branco.
			materialType = AtmosphericTriplanarZoomRotation
			Material
			{
				factor = 7.5
				factorBlendWidth = 0.05
				factorRotation = 135
				saturation = 1
				contrast = 1
				tintColor = 1,1,1,0
				specularColor = 0.04,0.04,0.04,0.2
				albedoBrightness = 1
				steepPower = 2.5
				steepTexStart = 12500
				steepTexEnd = 36500
				steepTex = GargantuaSystem/PluginData/Edmunds/Edmunds_detail.png
				steepBumpMap = GargantuaSystem/PluginData/Edmunds/Edmunds_detail_nrm.png
				steepNearTiling = 100
				steepTiling = 50
				lowTex = GargantuaSystem/PluginData/Edmunds/Edmunds_detail.png
				lowTiling = 38000
				midTex = GargantuaSystem/PluginData/Edmunds/Edmunds_detail.png
				midTiling = 38000
				midBumpMap = GargantuaSystem/PluginData/Edmunds/Edmunds_detail_nrm.png
				midBumpTiling = 38000
				highTex = GargantuaSystem/PluginData/Edmunds/Edmunds_detail.png
				highTiling = 38000
				lowStart = -1
				lowEnd = -1
				highStart = 2
				highEnd = 2
				globalDensity = -5E-06
				fogColorRamp = GargantuaSystem/PluginData/Edmunds/Edmunds_fogramp.png
				planetOpacity = 0
				oceanFogDistance = 1000
			}
			Mods
			{
				// Mapa: 0 = -1200 m, 1 = +3800 m
				VertexHeightMap
				{
					map = GargantuaSystem/PluginData/Edmunds/Edmunds_height.png
					offset = -1200
					deformity = 5000
					scaleDeformityByRadius = false
					order = 20
					enabled = true
				}
				VertexSimplexHeightAbsolute
				{
					deformity = 40
					frequency = 35
					octaves = 4
					persistence = 0.5
					seed = 777
					order = 21
					enabled = true
				}
				VertexColorMap
				{
					map = GargantuaSystem/PluginData/Edmunds/Edmunds_color.png
					order = 500
					enabled = true
				}
			}
		}
	}
}

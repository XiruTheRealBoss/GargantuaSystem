// Estrela de nêutrons (sem nome no filme), orbitando Gargantua fora do disco de acreção.
// Massa ~1,4 massa solar escalada para o Kerbol (1,4 × 1.7565E28 kg); raio de 20 km. Não emite luz no jogo.
// Pouso impossível: calor letal num raio grande. Nome interno com prefixo para não colidir com outros packs.
@Kopernicus:FOR[GargantuaSystem]
{
	Body
	{
		name = GargantuaNeutronStar
		identifier = GargantuaSystem/GargantuaNeutronStar
		cacheFile = GargantuaSystem/Cache/GargantuaNeutronStar.bin
		// Template de corpo rochoso: com o template Sun o Kopernicus ainda o trataria como estrela
		Template
		{
			name = Minmus
			removeAllPQSMods = true
		}
		Properties
		{
			displayName = #LOC_GargSys_NeutronStar_name
			description = #LOC_GargSys_NeutronStar_desc
			radius = 20000
			mass = 2.4591E28
			// Real seria < 1 s; 30 s evita o bug de "fast rotators" do Kopernicus (#825)
			rotationPeriod = 30
			timewarpAltitudeLimits = 0 1.0E6 2.0E6 4.0E6 8.0E6 1.6E7 3.2E7 6.4E7
			maxZoom = 200000
			ScienceValues
			{
				flyingLowDataValue = 1
				flyingHighDataValue = 1
				inSpaceLowDataValue = 30
				inSpaceHighDataValue = 14
				recoveryValue = 18
				flyingAltitudeThreshold = 1.0E6
				spaceAltitudeThreshold = 5.0E7
			}
			// um bioma só (sem isso herdaria os biomas de Minmus do template)
			biomeMap = GargantuaSystem/Textures/White.png
			Biomes
			{
				Biome
				{
					name = Surface
					displayName = #LOC_GargSys_Biome_NSSurface
					value = 1
					color = #FFFFFF
				}
			}
		}
		Orbit
		{
			referenceBody = Gargantua
			semiMajorAxis = 3.5E10
			eccentricity = 0.1
			inclination = 6
			longitudeOfAscendingNode = 300
			argumentOfPeriapsis = 45
			meanAnomalyAtEpoch = 3
			epoch = 0
			color = 0.60,0.75,1,1
		}
		HazardousBody
		{
			Item
			{
				ambientTemp = 8000
				AltitudeCurve
				{
					key = 0 1
					key = 2.0E6 0.7
					key = 1.0E7 0.2
					key = 4.0E7 0
				}
			}
		}
		// NÃO é "type = Star": o Kopernicus troca a luz da cena para a estrela mais PRÓXIMA da nave, e esta
		// (pequena, a 3,5E10 m de Gargantua) roubava a luz de Mann e da boca B do wormhole, que ficavam no escuro.
		ScaledVersion
		{
			type = Vacuum
			OnDemand
			{
				texture = GargantuaSystem/Textures/White.png
			}
			Material
			{
				color = 0.80,0.88,1,1
				specColor = 1,1,1,1
				shininess = 1
			}
		}
	}
}

// Estrela de nêutrons (sem nome no filme), orbitando Gargantua fora do disco de acreção.
// Massa ~1,4 massa solar escalada para o Kerbol (1,4 × 1.7565E28 kg); raio de 20 km.
// Pouso impossível: calor letal num raio grande. Nome interno com prefixo para não colidir com outros packs.
@Kopernicus:FOR[GargantuaSystem]
{
	Body
	{
		name = GargantuaNeutronStar
		identifier = GargantuaSystem/GargantuaNeutronStar
		Template
		{
			name = Sun
			removeCoronas = true
		}
		Properties
		{
			displayName = #LOC_GargSys_NeutronStar_name
			description = #LOC_GargSys_NeutronStar_desc
			radius = 20000
			mass = 2.4591E28
			// Real seria < 1 s; 30 s evita o bug de "fast rotators" do Kopernicus (#825)
			rotationPeriod = 30
			timewarpAltitudeLimits = 0 1.0E6 2.0E6 4.0E6 8.0E6 1.6E7 3.2E7 6.4E7
			maxZoom = 200000
			ScienceValues
			{
				flyingLowDataValue = 1
				flyingHighDataValue = 1
				inSpaceLowDataValue = 30
				inSpaceHighDataValue = 14
				recoveryValue = 18
				flyingAltitudeThreshold = 1.0E6
				spaceAltitudeThreshold = 5.0E7
			}
		}
		Orbit
		{
			referenceBody = Gargantua
			semiMajorAxis = 3.5E10
			eccentricity = 0.1
			inclination = 6
			longitudeOfAscendingNode = 300
			argumentOfPeriapsis = 45
			meanAnomalyAtEpoch = 3
			epoch = 0
			color = 0.60,0.75,1,1
		}
		HazardousBody
		{
			Item
			{
				ambientTemp = 8000
				AltitudeCurve
				{
					key = 0 1
					key = 2.0E6 0.7
					key = 1.0E7 0.2
					key = 4.0E7 0
				}
			}
		}
		ScaledVersion
		{
			type = Star
			Light
			{
				sunlightColor = 0.75,0.85,1,1
				scaledSunlightColor = 0.75,0.85,1,1
				IVASunColor = 0.75,0.85,1,1
				sunLensFlareColor = 0.55,0.70,1,1
				// Fonte fraca e de alcance curto (quase tudo é raio X; liberdade criativa)
				luminosity = 60
				sunAU = 1.0E9
				IntensityCurve
				{
					key = 0 2
					key = 5.0E8 1
					key = 5.0E9 0.1
					key = 2.0E10 0
				}
				ScaledIntensityCurve
				{
					key = 0 2
					key = 8.333E4 1
					key = 8.333E5 0.1
					key = 3.333E6 0
				}
				IVAIntensityCurve
				{
					key = 0 2
					key = 5.0E8 1
					key = 5.0E9 0.1
					key = 2.0E10 0
				}
			}
			Material
			{
				emitColor0 = 0.70,0.82,1,1
				emitColor1 = 0.85,0.92,1,1
				sunspotColor = 0.40,0.55,1,1
				rimColor = 0.60,0.75,1,1
			}
		}
	}
}

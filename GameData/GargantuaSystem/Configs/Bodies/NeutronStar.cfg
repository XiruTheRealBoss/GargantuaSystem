// Estrela de nêutrons (sem nome no filme), orbitando Gargantua fora do disco de acreção.
// Massa ~1,4 massa solar escalada para o Kerbol (1,4 × 1.7565E28 kg); raio de 20 km. Brilha (estrela azul),
// mas não ilumina a cena (ver ScaledVersion).
// Pouso impossível: calor letal num raio grande. Nome interno com prefixo para não colidir com outros packs.
@Kopernicus:FOR[GargantuaSystem]
{
	Body
	{
		name = GargantuaNeutronStar
		identifier = GargantuaSystem/GargantuaNeutronStar
		cacheFile = GargantuaSystem/Cache/GargantuaNeutronStar.bin
		Template
		{
			name = Sun
		}
		Properties
		{
			displayName = #LOC_GargSys_NeutronStar_name
			description = #LOC_GargSys_NeutronStar_desc
			radius = 20000
			mass = 2.4591E28
			// Real seria < 1 s; 30 s evita o bug de "fast rotators" do Kopernicus (#825)
			rotationPeriod = 30
			timewarpAltitudeLimits = 0 1.0E6 2.0E6 4.0E6 8.0E6 1.6E7 3.2E7 6.4E7
			maxZoom = 200000
			ScienceValues
			{
				flyingLowDataValue = 1
				flyingHighDataValue = 1
				inSpaceLowDataValue = 30
				inSpaceHighDataValue = 14
				recoveryValue = 18
				flyingAltitudeThreshold = 1.0E6
				spaceAltitudeThreshold = 5.0E7
			}
		}
		Orbit
		{
			referenceBody = Gargantua
			semiMajorAxis = 3.5E10
			eccentricity = 0.1
			inclination = 6
			longitudeOfAscendingNode = 300
			argumentOfPeriapsis = 45
			meanAnomalyAtEpoch = 3
			epoch = 0
			color = 0.60,0.75,1,1
		}
		HazardousBody
		{
			Item
			{
				ambientTemp = 8000
				AltitudeCurve
				{
					key = 0 1
					key = 2.0E6 0.7
					key = 1.0E7 0.2
					key = 4.0E7 0
				}
			}
		}
		// Estrela de verdade (como a Anubis do Cosmic Serenity), mas givesOffLight = false: o Kopernicus troca a luz da
		// cena para a estrela mais PRÓXIMA que emite luz (KopernicusStar.cs ignora as outras). Emitindo, esta (pequena,
		// a 3,5E10 m de Gargantua) roubava a luz de Mann e da boca B. Assim ela brilha, mas não ilumina a cena.
		// Sem jatos: desenhá-los por cima da lente do Singularity exigia uma câmera extra, que bagunçava o céu.
		// Sem lente do Singularity: a esfera da lente ficava escura e enorme em volta da estrela.
		ScaledVersion
		{
			type = Star
			Light
			{
				givesOffLight = false
				sunlightColor = 0.75,0.85,1,1
				scaledSunlightColor = 0.75,0.85,1,1
				IVASunColor = 0.75,0.85,1,1
				sunLensFlareColor = 0.5,0.7,1,1
				luminosity = 0
			}
			Material
			{
				emitColor0 = 0.85,0.92,1,1
				emitColor1 = 0.55,0.75,1,1
				sunspotColor = 0.35,0.5,1,1
				sunspotPower = 3
				rimColor = 0.7,0.85,1,1
				rimPower = 2
				rimBlend = 0
			}
		}
	}
}

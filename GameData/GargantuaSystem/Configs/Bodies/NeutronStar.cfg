// Neutron star (unnamed in the film), orbiting Gargantua outside the accretion disk.
// Mass ~1.4 solar masses scaled to Kerbol (1.4 x 1.7565E28 kg); 20 km radius. Pulsar: it glows and has jets,
// but does not light the scene (see ScaledVersion).
// Landing impossible: lethal heat over a large radius. Internal name is prefixed to avoid clashing with other packs.
@Kopernicus:FOR[GargantuaSystem]
{
	Body
	{
		name = GargantuaNeutronStar
		identifier = GargantuaSystem/GargantuaNeutronStar
		cacheFile = GargantuaSystem/Cache/GargantuaNeutronStar.bin
		Template
		{
			name = Sun
		}
		Properties
		{
			displayName = #LOC_GargSys_NeutronStar_name
			description = #LOC_GargSys_NeutronStar_desc
			radius = 20000
			mass = 2.4591E28
			// Real value would be < 1 s; 30 s avoids Kopernicus' "fast rotators" bug (#825)
			rotationPeriod = 30
			timewarpAltitudeLimits = 0 1.0E6 2.0E6 4.0E6 8.0E6 1.6E7 3.2E7 6.4E7
			maxZoom = 200000
			ScienceValues
			{
				flyingLowDataValue = 1
				flyingHighDataValue = 1
				inSpaceLowDataValue = 30
				inSpaceHighDataValue = 14
				recoveryValue = 18
				flyingAltitudeThreshold = 1.0E6
				spaceAltitudeThreshold = 5.0E7
			}
		}
		Orbit
		{
			referenceBody = Gargantua
			// outside Gargantua's lens sphere (5.4E10 m, Singularity.cfg; inside it the sky tore) and away from Mann
			// (7E10 m): this star's SOI is ~2.3E10 m and, at 6.2E10, it reached Mann's orbit
			semiMajorAxis = 1.0E11
			eccentricity = 0
			inclination = 6
			longitudeOfAscendingNode = 300
			argumentOfPeriapsis = 45
			meanAnomalyAtEpoch = 3
			epoch = 0
			color = 0.60,0.75,1,1
		}
		HazardousBody
		{
			Item
			{
				ambientTemp = 8000
				AltitudeCurve
				{
					key = 0 1
					key = 2.0E6 0.7
					key = 1.0E7 0.2
					key = 4.0E7 0
				}
			}
		}
		// A real star (like Cosmic Serenity's Anubis), but givesOffLight = false: Kopernicus switches the scene light
		// to the CLOSEST star that gives off light (KopernicusStar.cs ignores the others). If it emitted, this one (small,
		// 1E11 m from Gargantua) would steal the light of Mann and mouth B. This way it glows but does not light the scene.
		// Pulsar jets: plugin (src/GargantuaWaves/ScaledEffects.cs).
		// No Singularity lens: the lens sphere was dark and huge around the star.
		ScaledVersion
		{
			type = Star
			Light
			{
				givesOffLight = false
				sunlightColor = 0.75,0.85,1,1
				scaledSunlightColor = 0.75,0.85,1,1
				IVASunColor = 0.75,0.85,1,1
				sunLensFlareColor = 0.5,0.7,1,1
				luminosity = 0
			}
			Material
			{
				emitColor0 = 0.85,0.92,1,1
				emitColor1 = 0.55,0.75,1,1
				sunspotColor = 0.35,0.5,1,1
				sunspotPower = 3
				rimColor = 0.7,0.85,1,1
				rimPower = 2
				rimBlend = 0
			}
		}
	}
}

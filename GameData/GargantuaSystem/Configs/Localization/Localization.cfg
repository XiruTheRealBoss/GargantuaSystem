	pt-br
	{
		#LOC_GargSys_Gargantua_name = Gargantua
		#LOC_GargSys_Gargantua_desc = Um buraco negro supermassivo girando quase no limite, envolto num disco de acreção fino e incandescente. A luz contorna o horizonte de eventos, e o lado de trás do disco aparece em arco por cima dele. Os cientistas recomendam distância. Os Kerbals recomendam chegar mais perto.

		#LOC_GargSys_Miller_name = Miller
		#LOC_GargSys_Miller_desc = Um mundo oceânico em maré travada, raspando o disco de Gargantua. A água mal passa do joelho, o que parece tranquilo até você reparar nas ondas de maré de um quilômetro de altura no horizonte. Cada hora aqui embaixo parece muito, muito tempo lá em casa.
		#LOC_GargSys_Mann_name = Mann
		#LOC_GargSys_Mann_desc = Um mundo-geleira cinza-esbranquiçado de gelo enrugado, fendas profundas, veios de cinza vulcânica escura e nuvens tão frias que parecem penduradas, sólidas, no céu. O levantamento original o chamou de promissor. O levantamento original talvez tenha sido otimista.
		#LOC_GargSys_Edmunds_name = Edmunds
		#LOC_GargSys_Edmunds_desc = Um mundo seco de planícies de cascalho cheias de matacões e cordilheiras serrilhadas, com salinas claras e pequenos campos de dunas, aquecido pela luz constante de Pantagruel. O ar é rarefeito, mas respirável, e este pode ser o melhor lugar do sistema para chamar de lar.
		#LOC_GargSys_Pantagruel_name = Pantagruel
		#LOC_GargSys_Pantagruel_desc = Uma estrela laranja e tranquila, orbitando longe de Gargantua. Depois do buraco negro, a luz comum dela parece quase caseira.
		#LOC_GargSys_NeutronStar_name = Estrela de nêutrons
		#LOC_GargSys_NeutronStar_desc = O núcleo colapsado de uma estrela morta há muito tempo: vinte quilômetros de diâmetro e mais pesado que o Kerbol. A gravidade é extrema e a radiação é pior. Olhe, colete dados e não toque.

		#LOC_GargSys_Biome_Shallows = Águas rasas
		#LOC_GargSys_Biome_PolarShallows = Águas rasas polares
		#LOC_GargSys_Biome_IcePlains = Planícies de gelo
		#LOC_GargSys_Biome_PressureRidges = Cristas de pressão
		#LOC_GargSys_Biome_CrevasseFields = Campos de fendas
		#LOC_GargSys_Biome_FrozenHighlands = Planaltos congelados
		#LOC_GargSys_Biome_Poles = Polos
		#LOC_GargSys_Biome_RockyPlains = Planícies rochosas
		#LOC_GargSys_Biome_Mountains = Montanhas
		#LOC_GargSys_Biome_SaltFlats = Salinas
		#LOC_GargSys_Biome_DuneFields = Campos de dunas
		#LOC_GargSys_Biome_Canyons = Cânions
		#LOC_GargSys_WormholeA_name = Wormhole (lado do Kerbol)
		#LOC_GargSys_WormholeB_name = Wormhole (lado de Gargantua)
		#LOC_GargSys_Wormhole_desc = Um buraco esférico no espaço. Olhe para dentro e você vê outra galáxia, curvada em volta da borda. Entre devagar, mantenha o nariz apontado para o centro e confie em quem colocou isso aqui.
		#LOC_GargSys_Biome_Throat = Garganta

	en-us
	{
		#LOC_GargSys_Gargantua_name = Gargantua
		#LOC_GargSys_Gargantua_desc = A rapidly spinning supermassive black hole, wrapped in a thin, blazing accretion disk. Its light bends around the event horizon, so you can see the far side of the disk arching over the top. Scientists suggest keeping a respectful distance. Kerbals suggest a closer look.

		#LOC_GargSys_Miller_name = Miller
		#LOC_GargSys_Miller_desc = A tidally locked ocean world skimming Gargantua's disk. The water is barely knee-deep, which sounds relaxing until you notice the kilometre-high tidal waves on the horizon. Every hour spent down here feels like a very, very long time back home.
		#LOC_GargSys_Mann_name = Mann
		#LOC_GargSys_Mann_desc = A grey-white glacier world of crumpled ice, deep crevasses, streaks of dark volcanic ash and clouds so cold they seem to hang solid in the sky. The original survey called it promising. The original survey may have been optimistic.
		#LOC_GargSys_Edmunds_name = Edmunds
		#LOC_GargSys_Edmunds_desc = A dry world of boulder-strewn gravel plains and jagged mountain ranges, with pale salt flats and small dune fields, warmed by the steady light of Pantagruel. The air is thin but breathable, and it might be the best place in this system to call home.
		#LOC_GargSys_Pantagruel_name = Pantagruel
		#LOC_GargSys_Pantagruel_desc = A calm orange star orbiting far out from Gargantua. After the black hole, its ordinary sunlight feels almost homely.
		#LOC_GargSys_NeutronStar_name = Neutron Star
		#LOC_GargSys_NeutronStar_desc = The collapsed core of a long-dead star, twenty kilometres across and heavier than Kerbol. Its gravity is extreme and its radiation is worse. Look, take readings, and do not touch.


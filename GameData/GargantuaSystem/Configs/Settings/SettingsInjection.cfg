// Copia GargantuaSystemSettings para dentro dos root nodes, para os patches poderem usar :HAS[@GargantuaSystemSettings:HAS[...]].
// A cópia é removida no :FINAL e não chega ao Kopernicus.
@Kopernicus:BEFORE[GargantuaSystem]
{
	#@GargantuaSystemSettings {}
}
@Kopernicus:FINAL
{
	!GargantuaSystemSettings {}
}

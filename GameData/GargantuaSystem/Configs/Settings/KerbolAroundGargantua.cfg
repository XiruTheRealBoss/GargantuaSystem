// DistanceFactor = 0: Kerbol passa a orbitar Gargantua (que tem ~57x a massa dele).
// É o arranjo fisicamente correto e é o único que o Principia aceita (forçado em Compat/Principia.cfg).
// EXPERIMENTAL. Não troque com um save em andamento sem backup.
//
// Como funciona (mesma técnica do Kcalbeloh System):
//   - o KSP precisa que o corpo raiz se chame "Sun" e que Kerbin orbite a raiz no carregamento;
//   - então o Sun stock vira "Kerbol" e Gargantua vira "Sun" (a raiz). Os identifiers não mudam, e por
//     isso as naves dos saves continuam nos mesmos corpos;
//   - todo corpo que orbitava o Sun (inclusive planetas de outros mods) passa a orbitar Kerbol;
//   - Kerbin carrega orbitando a raiz e o Kopernicus a move para Kerbol depois (PostSpawnOrbit).
// LAST: roda depois dos FOR/AFTER de todos os outros planet packs, para pegar os planetas deles também.
@Kopernicus:HAS[@GargantuaSystemSettings:HAS[#DistanceFactor[0]]]:LAST[GargantuaSystem]
{
	@Body:HAS[@Orbit:HAS[#referenceBody[Sun]]]
	{
		@Orbit
		{
			@referenceBody = Kerbol
		}
	}
	@Body:HAS[@Orbit:HAS[#referenceBody[Gargantua]]]
	{
		@Orbit
		{
			@referenceBody = Sun
		}
	}
	@Body[Sun]
	{
		@name = Kerbol
		// 5E12 m: ~37x a órbita de Eeloo; perto o bastante para o Principia, longe o bastante para não
		// misturar as esferas de influência (SOI do Kerbol ≈ 1E12 m; Pantagruel fica a 5E11 m de Gargantua)
		Orbit
		{
			referenceBody = Sun
			semiMajorAxis = 5.0E12
			eccentricity = 0.01
			inclination = 25
			longitudeOfAscendingNode = 60
			argumentOfPeriapsis = 0
			meanAnomalyAtEpoch = 3.14159
			epoch = 0
			color = 1,0.85,0.5,1
		}
	}
	@Body[Gargantua]
	{
		@name = Sun
		!Orbit {}
		@Properties
		{
			!sphereOfInfluence = delete
		}
	}
	@Body[Kerbin]
	{
		@Orbit
		{
			@referenceBody = Sun
		}
		PostSpawnOrbit
		{
			referenceBody = Kerbol
		}
	}
	// RSS: sistema 10x maior (Netuno a 4,5E12 m), então Kerbol (o Sol) vai 10x mais longe
	@Body[Kerbol]:NEEDS[RealSolarSystem]
	{
		@Orbit
		{
			@semiMajorAxis *= 10
		}
	}
}

// Singularity: o objeto é achado pelo nome do corpo, que agora é "Sun"
@Singularity:HAS[@Singularity_object[Gargantua],@GargantuaSystemSettings:HAS[#DistanceFactor[0]]]:LAST[GargantuaSystem]
{
	@Singularity_object[Gargantua]
	{
		@name = Sun
	}
}

// Scatterer: a "estrela principal" dos planetas stock agora se chama Kerbol; a de Miller/Mann, Sun
@Scatterer_planetsList:BEFORE[GargantuaSystem]
{
	#@GargantuaSystemSettings {}
}
@Scatterer_planetsList:HAS[@GargantuaSystemSettings:HAS[#DistanceFactor[0]]]:LAST[GargantuaSystem]
{
	@scattererCelestialBodies
	{
		// outros mods registram o próprio Sol (ex.: BetterKerbol, coroa via Scatterer)
		@Item:HAS[#celestialBodyName[Sun]]
		{
			@celestialBodyName = Kerbol
			@transformName = Kerbol
		}
		@Item:HAS[#mainSunCelestialBody[Sun]]
		{
			@mainSunCelestialBody = Kerbol
		}
		@Item:HAS[#mainSunCelestialBody[Gargantua]]
		{
			@mainSunCelestialBody = Sun
		}
	}
}
@Scatterer_planetsList:FINAL
{
	!GargantuaSystemSettings {}
}
@Scatterer_sunflare:BEFORE[GargantuaSystem]
{
	#@GargantuaSystemSettings {}
}
@Scatterer_sunflare:HAS[@GargantuaSystemSettings:HAS[#DistanceFactor[0]]]:LAST[GargantuaSystem]
{
	// o flare é um nó com o nome da estrela; "|_" renomeia o próprio nó
	@Sun
	{
		|_ = Kerbol
	}
}
@Scatterer_sunflare:FINAL
{
	!GargantuaSystemSettings {}
}

// Outros mods que acham o Sol pelo nome em tempo de execução: atmosfera do Scatterer (coroa do BetterKerbol)
// e efeitos de PQS do EVE. Sem isto eles iriam parar em volta do buraco negro.
@Scatterer_atmosphere:BEFORE[GargantuaSystem]
{
	#@GargantuaSystemSettings {}
}
@Scatterer_atmosphere:HAS[@GargantuaSystemSettings:HAS[#DistanceFactor[0]]]:LAST[GargantuaSystem]
{
	@Atmo[Sun]
	{
		@name = Kerbol
	}
}
@Scatterer_atmosphere:FINAL
{
	!GargantuaSystemSettings {}
}
@PQS_MANAGER:BEFORE[GargantuaSystem]
{
	#@GargantuaSystemSettings {}
}
@PQS_MANAGER:HAS[@GargantuaSystemSettings:HAS[#DistanceFactor[0]]]:LAST[GargantuaSystem]
{
	@OBJECT:HAS[#body[Sun]]
	{
		@body = Kerbol
	}
}
@PQS_MANAGER:FINAL
{
	!GargantuaSystemSettings {}
}

// DistanceFactor = 0: Kerbol orbits Gargantua (which has ~57x its mass).
// It is the physically correct layout and the only one Principia accepts (forced in Compat/Principia.cfg).
// EXPERIMENTAL. Do not switch it on a save in progress without a backup.
//
// How it works (same technique as the Kcalbeloh System):
//  - KSP needs the root body to be called "Sun" and Kerbin to orbit the root at load time;
//  - so the stock Sun becomes "Kerbol" and Gargantua becomes "Sun" (the root). Identifiers do not change, so
//    vessels in saves stay on the same bodies;
//  - every body that orbited the Sun (including other mods' planets) now orbits Kerbol;
//  - Kerbin loads orbiting the root and Kopernicus moves it to Kerbol afterwards (PostSpawnOrbit).
// LAST: runs after the FOR/AFTER passes of every other planet pack, to catch their planets too.
@Kopernicus:HAS[@GargantuaSystemSettings:HAS[#DistanceFactor[0]]]:LAST[GargantuaSystem]
{
	@Body:HAS[@Orbit:HAS[#referenceBody[Sun]]]
	{
		@Orbit
		{
			@referenceBody = Kerbol
		}
	}
	@Body:HAS[@Orbit:HAS[#referenceBody[Gargantua]]]
	{
		@Orbit
		{
			@referenceBody = Sun
		}
	}
	@Body[Sun]
	{
		@name = Kerbol
		// 5E12 m: ~37x Eeloo's orbit; close enough for Principia, far enough not to
		// mix the spheres of influence (Kerbol SOI ~1E12 m; Pantagruel is 5E11 m from Gargantua)
		Orbit
		{
			referenceBody = Sun
			semiMajorAxis = 5.0E12
			eccentricity = 0.01
			inclination = 25
			longitudeOfAscendingNode = 60
			argumentOfPeriapsis = 0
			meanAnomalyAtEpoch = 3.14159
			epoch = 0
			color = 1,0.85,0.5,1
		}
	}
	@Body[Gargantua]
	{
		@name = Sun
		!Orbit {}
		@Properties
		{
			!sphereOfInfluence = delete
		}
	}
	@Body[Kerbin]
	{
		@Orbit
		{
			@referenceBody = Sun
		}
		PostSpawnOrbit
		{
			referenceBody = Kerbol
		}
	}
	// RSS: 10x larger system (Neptune at 4.5E12 m), so Kerbol (the Sun) goes 10x farther
	@Body[Kerbol]:NEEDS[RealSolarSystem]
	{
		@Orbit
		{
			@semiMajorAxis *= 10
		}
	}
}

// Singularity: the object is found by the body name, which is now "Sun"
@Singularity:HAS[@Singularity_object[Gargantua],@GargantuaSystemSettings:HAS[#DistanceFactor[0]]]:LAST[GargantuaSystem]
{
	@Singularity_object[Gargantua]
	{
		@name = Sun
	}
}

// Scatterer: the stock planets' "main star" is now called Kerbol; Miller/Mann's is Sun
@Scatterer_planetsList:BEFORE[GargantuaSystem]
{
	#@GargantuaSystemSettings {}
}
@Scatterer_planetsList:HAS[@GargantuaSystemSettings:HAS[#DistanceFactor[0]]]:LAST[GargantuaSystem]
{
	@scattererCelestialBodies
	{
		// other mods register their own Sun (e.g. BetterKerbol, corona via Scatterer)
		@Item:HAS[#celestialBodyName[Sun]]
		{
			@celestialBodyName = Kerbol
			@transformName = Kerbol
		}
		@Item:HAS[#mainSunCelestialBody[Sun]]
		{
			@mainSunCelestialBody = Kerbol
		}
		@Item:HAS[#mainSunCelestialBody[Gargantua]]
		{
			@mainSunCelestialBody = Sun
		}
	}
}
@Scatterer_planetsList:FINAL
{
	!GargantuaSystemSettings {}
}
@Scatterer_sunflare:BEFORE[GargantuaSystem]
{
	#@GargantuaSystemSettings {}
}
@Scatterer_sunflare:HAS[@GargantuaSystemSettings:HAS[#DistanceFactor[0]]]:LAST[GargantuaSystem]
{
	// the flare is a node named after the star; "|_" renames the node itself
	@Sun
	{
		|_ = Kerbol
	}
}
@Scatterer_sunflare:FINAL
{
	!GargantuaSystemSettings {}
}

// Other mods that find the Sun by name at runtime: Scatterer atmosphere (BetterKerbol's corona)
// and EVE PQS effects. Without this they would end up around the black hole.
@Scatterer_atmosphere:BEFORE[GargantuaSystem]
{
	#@GargantuaSystemSettings {}
}
@Scatterer_atmosphere:HAS[@GargantuaSystemSettings:HAS[#DistanceFactor[0]]]:LAST[GargantuaSystem]
{
	@Atmo[Sun]
	{
		@name = Kerbol
	}
}
@Scatterer_atmosphere:FINAL
{
	!GargantuaSystemSettings {}
}
@PQS_MANAGER:BEFORE[GargantuaSystem]
{
	#@GargantuaSystemSettings {}
}
@PQS_MANAGER:HAS[@GargantuaSystemSettings:HAS[#DistanceFactor[0]]]:LAST[GargantuaSystem]
{
	@OBJECT:HAS[#body[Sun]]
	{
		@body = Kerbol
	}
}
@PQS_MANAGER:FINAL
{
	!GargantuaSystemSettings {}
}

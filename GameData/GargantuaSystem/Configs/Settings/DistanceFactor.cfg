// DistanceFactor: escala a órbita de Gargantua em volta do Kerbol (padrão 2.0E14 m).
// O valor 0 (Kerbol orbitando Gargantua) fica em Compat/Principia.cfg (fase 4).
@Kopernicus:AFTER[GargantuaSystem]:HAS[@GargantuaSystemSettings:HAS[#DistanceFactor[0.1]]]
{
	@Body[Gargantua] { @Orbit { @semiMajorAxis *= 0.1 } }
}
@Kopernicus:AFTER[GargantuaSystem]:HAS[@GargantuaSystemSettings:HAS[#DistanceFactor[10]]]
{
	@Body[Gargantua] { @Orbit { @semiMajorAxis *= 10 } }
}
@Kopernicus:AFTER[GargantuaSystem]:HAS[@GargantuaSystemSettings:HAS[#DistanceFactor[100]]]
{
	@Body[Gargantua] { @Orbit { @semiMajorAxis *= 100 } }
}

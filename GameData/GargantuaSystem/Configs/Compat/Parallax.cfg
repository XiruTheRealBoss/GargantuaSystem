// Parallax Continued: fine relief (tessellation) and 3D rocks, like the Kerbol planets.
// Reuses the assets of Parallax's stock package (not shipped with this mod):
//  Mann    <- Eeloo (terrain: grey-white ice) + Dres (rocks)
//  Edmunds <- Dres  (grey-brown rock, small to huge boulders)
// The stock scatters only depend on altitude and noise (no biomes), so the copy works as is.

// PQS subdivision Parallax needs to tessellate (same values as the stock package for Eeloo/Dres)
@Kopernicus:AFTER[GargantuaSystem]:NEEDS[ParallaxContinued,Parallax_StockTerrainTextures]
{
	@Body[Mann]
	{
		@PQS
		{
			@Mods
			{
				Parallax
				{
					subdivisionLevel = 6
					subdivisionRadius = 500
					order = 999999
				}
			}
		}
	}
	@Body[Edmunds]
	{
		@PQS
		{
			@Mods
			{
				Parallax
				{
					subdivisionLevel = 6
					subdivisionRadius = 500
					order = 999999
				}
			}
		}
	}
}

// terrain textures
@ParallaxTerrain:HAS[@Body[Eeloo]]:AFTER[GargantuaSystem]:NEEDS[ParallaxContinued,Parallax_StockTerrainTextures]
{
	+Body[Eeloo]
	{
		@name = Mann
		@ShaderProperties
		{
			// "mid" texture (crumpled ice) up to ~1.5 km, "high" (snow/smooth ice) on plateaus and high ridges
			@_MidHighBlendStart = 1500
			@_MidHighBlendEnd = 2500
		}
	}
}
@ParallaxTerrain:HAS[@Body[Dres]]:AFTER[GargantuaSystem]:NEEDS[ParallaxContinued,Parallax_StockTerrainTextures]
{
	+Body[Dres]
	{
		@name = Edmunds
	}
}

// rocks
// Mann gets Dres' rocks (moraine debris, like the film's glacier), not Eeloo's ice slabs:
// on Mann's crumpled relief the slabs barely spawned and the few that did vanished into the ice colour.
// lower steepPower = more tolerant slope filter (Mann is much rougher than Dres).
@ParallaxScatters:HAS[@Body[Dres]]:AFTER[GargantuaSystem]:NEEDS[ParallaxContinued,Parallax_StockScatterTextures]
{
	+Body[Dres]
	{
		@name = Mann
		@Scatter,*
		{
			@Distribution
			{
				@steepPower = 3
			}
		}
	}
}
@ParallaxScatters:HAS[@Body[Dres]]:AFTER[GargantuaSystem]:NEEDS[ParallaxContinued,Parallax_StockScatterTextures]
{
	+Body[Dres]
	{
		@name = Edmunds
	}
}

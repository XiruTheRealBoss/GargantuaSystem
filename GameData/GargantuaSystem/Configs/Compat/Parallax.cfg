// Parallax Continued (opcional): terreno com relevo fino (tesselação) e pedras 3D, como nos planetas do Kerbol.
// Reaproveita os assets do pacote stock do Parallax (não vêm com este mod):
//   Mann    <- Eeloo (terreno: gelo cinza-branco) + Dres (pedras)
//   Edmunds <- Dres  (rocha cinza-amarronzada, pedras pequenas a enormes)
// Os scatters stock só dependem de altitude e ruído (nada de biomas), então a cópia funciona como está.

// subdivisão do PQS que o Parallax precisa para tesselar (mesmos valores do pacote stock para Eeloo/Dres)
@Kopernicus:AFTER[GargantuaSystem]:NEEDS[ParallaxContinued,Parallax_StockTerrainTextures]
{
	@Body[Mann]
	{
		@PQS
		{
			@Mods
			{
				Parallax
				{
					subdivisionLevel = 6
					subdivisionRadius = 500
					order = 999999
				}
			}
		}
	}
	@Body[Edmunds]
	{
		@PQS
		{
			@Mods
			{
				Parallax
				{
					subdivisionLevel = 6
					subdivisionRadius = 500
					order = 999999
				}
			}
		}
	}
}

// texturas de terreno
@ParallaxTerrain:HAS[@Body[Eeloo]]:AFTER[GargantuaSystem]:NEEDS[ParallaxContinued,Parallax_StockTerrainTextures]
{
	+Body[Eeloo]
	{
		@name = Mann
		@ShaderProperties
		{
			// textura "mid" (gelo enrugado) até ~1,5 km, "high" (neve/gelo liso) nos platôs e cristas altas
			@_MidHighBlendStart = 1500
			@_MidHighBlendEnd = 2500
		}
	}
}
@ParallaxTerrain:HAS[@Body[Dres]]:AFTER[GargantuaSystem]:NEEDS[ParallaxContinued,Parallax_StockTerrainTextures]
{
	+Body[Dres]
	{
		@name = Edmunds
	}
}

// pedras
// Mann recebe as rochas do Dres (detritos de morena, como na geleira do filme), não as placas de gelo do Eeloo:
// no relevo enrugado de Mann as placas quase não nasciam e as poucas sumiam na cor do gelo.
// steepPower menor = filtro de inclinação mais tolerante (Mann é bem mais acidentado que Dres).
@ParallaxScatters:HAS[@Body[Dres]]:AFTER[GargantuaSystem]:NEEDS[ParallaxContinued,Parallax_StockScatterTextures]
{
	+Body[Dres]
	{
		@name = Mann
		@Scatter,*
		{
			@Distribution
			{
				@steepPower = 3
			}
		}
	}
}
@ParallaxScatters:HAS[@Body[Dres]]:AFTER[GargantuaSystem]:NEEDS[ParallaxContinued,Parallax_StockScatterTextures]
{
	+Body[Dres]
	{
		@name = Edmunds
	}
}

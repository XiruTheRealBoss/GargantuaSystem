// EVE (optional): 2D cloud layers. They work in EVE Redux and also in EVE with volumetric clouds.
// Textures generated by tools/gen_clouds.py (A = coverage).
// 2D fallback: only without the volumetric clouds pack (raymarched EVE + StockVolumetricClouds)
EVE_CLOUDS:NEEDS[EnvironmentalVisualEnhancements,!StockVolumetricClouds]
{
	// Miller: low, grey, almost unbroken overcast, like the film scene
	OBJECT
	{
		name = GargSys-Miller-overcast
		body = Miller
		altitude = 2500
		speed = 0,3,0
		detailSpeed = 0,5,0
		settings
		{
			_Color = 225,228,230,255
			_DetailTex = GargantuaSystem/Textures/EVE/cloud_detail
			_DetailScale = 40
			_DetailDist = 2E-06
			_MainTex = GargantuaSystem/Textures/EVE/Miller_clouds
		}
		layer2D
		{
			macroCloudMaterial
			{
				_FalloffScale = 10
				_FalloffPow = 0.7
				_RimDist = 0.001
				_InvFade = 0.02
			}
		}
	}
	// Mann: "frozen clouds", thin high sheets
	OBJECT
	{
		name = GargSys-Mann-frozen
		body = Mann
		altitude = 6000
		speed = 0,1,0
		detailSpeed = 0,2,0
		settings
		{
			_Color = 235,238,242,230
			_DetailTex = GargantuaSystem/Textures/EVE/cloud_detail
			_DetailScale = 25
			_DetailDist = 2E-06
			_MainTex = GargantuaSystem/Textures/EVE/Mann_clouds
		}
		layer2D
		{
			macroCloudMaterial
			{
				_FalloffScale = 10
				_FalloffPow = 0.7
				_RimDist = 0.001
				_InvFade = 0.02
			}
		}
	}
	// Edmunds: sparse fair-weather cumulus
	OBJECT
	{
		name = GargSys-Edmunds-cumulus
		body = Edmunds
		altitude = 4500
		speed = 0,8,0
		detailSpeed = 0,6,0
		settings
		{
			_Color = 250,248,244,235
			_DetailTex = GargantuaSystem/Textures/EVE/cloud_detail
			_DetailScale = 30
			_DetailDist = 2E-06
			_MainTex = GargantuaSystem/Textures/EVE/Edmunds_clouds
		}
		layer2D
		{
			macroCloudMaterial
			{
				_FalloffScale = 10
				_FalloffPow = 0.7
				_RimDist = 0.001
				_InvFade = 0.02
			}
		}
	}
}

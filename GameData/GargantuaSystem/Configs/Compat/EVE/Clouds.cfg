// EVE (opcional): camadas 2D de nuvens. Funcionam no EVE Redux e também no EVE com nuvens volumétricas.
// Texturas geradas por tools/gen_clouds.py (A = cobertura).
EVE_CLOUDS:NEEDS[EnvironmentalVisualEnhancements]
{
	// Miller: teto baixo, cinza e quase contínuo, como na cena do filme
	OBJECT
	{
		name = GargSys-Miller-overcast
		body = Miller
		altitude = 2500
		speed = 0,3,0
		detailSpeed = 0,5,0
		settings
		{
			_Color = 225,228,230,255
			_DetailTex = GargantuaSystem/Textures/EVE/cloud_detail
			_DetailScale = 40
			_DetailDist = 2E-06
			_MainTex = GargantuaSystem/Textures/EVE/Miller_clouds
		}
		layer2D
		{
			macroCloudMaterial
			{
				_FalloffScale = 10
				_FalloffPow = 0.7
				_RimDist = 0.001
				_InvFade = 0.02
			}
		}
	}
	// Mann: "nuvens congeladas", lâminas finas e altas
	OBJECT
	{

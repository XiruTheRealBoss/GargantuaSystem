// Custom skybox: needs SigmaReplacements-SkyBox (CKAN). Its DLL is "All Rights Reserved",
// so it is not shipped with this mod; without it this file does nothing and the stock sky stays.
// DisableSkybox = True  -> removes the mod's skybox.
// Principia             -> black skybox (hides Singularity + Principia artifacts; LGhassen/Singularity#4).
// Textures generated by tools/gen_skybox.py (6 faces: <path>_PositiveX ... _NegativeZ).
SigmaReplacements:NEEDS[SigmaReplacementsSkyBox]
{
	gargSys = true
	SkyBox
	{
		CubeMap
		{
			mirror = false
			rotate = false
			SkyBox = GargantuaSystem/Textures/Skybox/Gargantua
		}
	}
}

@SigmaReplacements:HAS[#gargSys[true]]:BEFORE[GargantuaSystem]
{
	#@GargantuaSystemSettings {}
}
@SigmaReplacements:HAS[#gargSys[true],@GargantuaSystemSettings:HAS[#DisableSkybox[?rue]]]:FOR[GargantuaSystem]
{
	!SkyBox,* {}
}
@SigmaReplacements:HAS[#gargSys[true],@GargantuaSystemSettings:HAS[#PrincipiaBlackSkybox[?rue]]]:AFTER[GargantuaSystem]
{
	!SkyBox,* {}
	SkyBox
	{
		CubeMap
		{
			mirror = false
			rotate = false
			SkyBox = GargantuaSystem/Textures/Skybox/Black
		}
	}
}
@SigmaReplacements:HAS[#gargSys[true]]:FINAL
{
	!GargantuaSystemSettings {}
	!gargSys = delete
}

// Skybox própria (opcional): precisa da SigmaReplacements-SkyBox (CKAN). A DLL é "All Rights Reserved",
// então ela não vai junto com o mod; sem ela este arquivo não faz nada e o céu stock continua.
// DisableSkybox = True  -> remove a skybox do mod.
// Principia             -> skybox preto (esconde artefatos de Singularity + Principia; LGhassen/Singularity#4).
// Texturas geradas por tools/gen_skybox.py (6 faces: <caminho>_PositiveX ... _NegativeZ).
SigmaReplacements:NEEDS[SigmaReplacementsSkyBox]
{
	gargSys = true
	SkyBox
	{
		CubeMap
		{
			mirror = false
			rotate = false
			SkyBox = GargantuaSystem/Textures/Skybox/Gargantua
		}
	}
}

@SigmaReplacements:HAS[#gargSys[true]]:BEFORE[GargantuaSystem]
{
	#@GargantuaSystemSettings {}
}
@SigmaReplacements:HAS[#gargSys[true],@GargantuaSystemSettings:HAS[#DisableSkybox[?rue]]]:FOR[GargantuaSystem]
{
	!SkyBox,* {}
}
@SigmaReplacements:HAS[#gargSys[true],@GargantuaSystemSettings:HAS[#PrincipiaBlackSkybox[?rue]]]:AFTER[GargantuaSystem]
{
	!SkyBox,* {}
	SkyBox
	{
		CubeMap
		{
			mirror = false
			rotate = false
			SkyBox = GargantuaSystem/Textures/Skybox/Black
		}
	}
}
@SigmaReplacements:HAS[#gargSys[true]]:FINAL
{
	!GargantuaSystemSettings {}
	!gargSys = delete
}

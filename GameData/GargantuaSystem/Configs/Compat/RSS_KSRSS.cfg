// Real Solar System / KSRSS.
// O RSS apaga do Kopernicus todo corpo que não reconhece. A técnica (a mesma do Kcalbeloh) é renomear o tipo
// do nó dos nossos corpos para "DontDeleteMe" antes do RSS e devolver para "Body" depois.
@Kopernicus:BEFORE[RealSolarSystem]:NEEDS[RealSolarSystem]
{
	@Body:HAS[#identifier[GargantuaSystem/*]]
	{
		|_ = DontDeleteMe
	}
}
@Kopernicus:AFTER[RealSolarSystem]:NEEDS[RealSolarSystem]
{
	@DontDeleteMe,*
	{
		|_ = Body
	}
}

// Wormhole do lado do Sol: perto de Saturno, como no filme (fora dos anéis e de Titã)
@Kopernicus:AFTER[GargantuaSystem]:NEEDS[RealSolarSystem|KSRSS]
{
	@Body[GargSysWormholeA]
	{
		@Orbit
		{
			@referenceBody = Saturn
			@semiMajorAxis = 3.0E9
			@inclination = 5
		}
	}
}

// Sistemas 10x maiores: afastar Gargantua na mesma proporção mantém o "sistema vizinho" fora da heliosfera.
// Os planetas de Gargantua NÃO são reescalados (use Sigma Dimensions se quiser; ver README).
@Kopernicus:AFTER[GargantuaSystem]:NEEDS[RealSolarSystem]:HAS[@GargantuaSystemSettings:HAS[~DistanceFactor[0]]]
{
	@Body[Gargantua]
	{
		@Orbit
		{
			@semiMajorAxis *= 10
		}
	}
}

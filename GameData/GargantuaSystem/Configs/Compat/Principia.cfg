// Principia: integra a gravidade de verdade (N corpos), então:
//   - Kerbol precisa orbitar Gargantua (DistanceFactor = 0); com Gargantua "parado" em órbita do Kerbol
//     a 2E14 m, o Principia o faria cair/derivar;
//   - os wormholes ficam desligados: o Principia não sabe de teleporte (a nave sairia com o estado errado);
//   - skybox preto: Singularity + Principia geram artefatos de lente (LGhassen/Singularity#4), e um fundo
//     preto esconde a maior parte.
// FIRST: antes de o settings ser copiado para os root nodes (BEFORE[GargantuaSystem]).
@GargantuaSystemSettings:NEEDS[Principia]:FIRST
{
	%DistanceFactor = 0
	%Wormholes = False
	%PrincipiaBlackSkybox = True
}

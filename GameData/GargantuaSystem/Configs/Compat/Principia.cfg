// Principia: integrates real (N-body) gravity, so:
//  - Kerbol must orbit Gargantua (DistanceFactor = 0); with Gargantua "parked" in orbit of Kerbol
//    at 2E14 m, Principia would make it fall/drift;
//  - wormholes are off: Principia does not know about teleports (the vessel would come out with the wrong state);
//  - black skybox: Singularity + Principia cause lensing artifacts (LGhassen/Singularity#4), and a black
//    background hides most of them.
// FIRST: before the settings are copied into the root nodes (BEFORE[GargantuaSystem]).
@GargantuaSystemSettings:NEEDS[Principia]:FIRST
{
	%DistanceFactor = 0
	%Wormholes = False
	%PrincipiaBlackSkybox = True
}

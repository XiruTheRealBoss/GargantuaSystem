// Oceano de Miller: ondas reais (FFT) no lugar do plano texturizado do oceano stock.
// Lição: com vento forte a crista passava da câmera rente à água e o Scatterer entrava no modo
// subaquático, que com darknessDepth baixo e cor escura deixava a cena inteira preta. Por isso:
// ondas moderadas e um modo subaquático claro (água rasa, ~3 m de profundidade).
Scatterer_ocean:NEEDS[Scatterer]
{
	Ocean
	{
		name = Miller
		AMP = 1
		m_windSpeed = 8
		m_omega = 0.84
		m_gravity = 12.75
		maxWaveInteractionShipAltitude = 500
		m_whiteCapStr = 0.25
		shoreFoam = 1
		m_farWhiteCapStr = -0.15
		// cor da água vinda de baixo: cinza-esverdeada escura, quase sem azul (filme)
		m_oceanUpwellingColor = 0.0060,0.0080,0.0075
		m_UnderwaterColor = 0.30,0.38,0.36
		offScreenVertexStretch = 1.25
		alphaRadius = 1000
		transparencyDepth = 30
		darknessDepth = 600
		refractionIndex = 1.33
		skyReflectionStrength = 1
		lightRaysStrength = 0.6
	}
}

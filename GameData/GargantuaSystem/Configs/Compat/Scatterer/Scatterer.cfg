// Scatterer: atmospheres with real scattering and an ocean with waves on Miller.
// Only applied if Scatterer (and its config pack, which creates the root nodes) is installed.
// Values picked from the film references:
//  Miller  — grey overcast sky (lots of neutral Mie haze), dark grey choppy sea
//  Mann    — cold whitish sky (little Rayleigh, light haze)
//  Edmunds — blue desert sky with a little dust
// The "sun" of Miller and Mann is Gargantua's disk; Edmunds' is Pantagruel.

@Scatterer_planetsList:NEEDS[Scatterer]:FOR[GargantuaSystem]
{
	@scattererCelestialBodies
	{
		Item
		{
			celestialBodyName = Miller
			transformName = Miller
			loadDistance = 100000000
			unloadDistance = 200000000
			hasOcean = True
			flatScaledSpaceModel = True
			usesCloudIntegration = True
			mainSunCelestialBody = Gargantua
			sunColor = 1,0.96,0.90,1
			sunsUseIntensityCurves = False
		}
		Item
		{
			celestialBodyName = Mann
			transformName = Mann
			loadDistance = 100000000
			unloadDistance = 200000000
			hasOcean = False
			flatScaledSpaceModel = True
			usesCloudIntegration = True
			mainSunCelestialBody = Gargantua
			sunColor = 1,0.96,0.90,1
			sunsUseIntensityCurves = False
		}
		Item
		{
			celestialBodyName = Edmunds
			transformName = Edmunds
			loadDistance = 100000000
			unloadDistance = 200000000
			hasOcean = False
			flatScaledSpaceModel = True
			usesCloudIntegration = True
			mainSunCelestialBody = Pantagruel
			sunColor = 1,0.90,0.78,1
			sunsUseIntensityCurves = False
		}
	}
}

// Own root node (not a patch): "@Scatterer_atmosphere" would match the node in every file and duplicate everything
// Atmospheres derived from Scatterer's stock configs (StockScattererConfigs: Kerbin and Laythe), already calibrated;
// only what is needed changes. The values invented before had 3-6x more (Mie) haze and looked washed out.
Scatterer_atmosphere:NEEDS[Scatterer]
{
	// Miller = Laythe (shallow sea under a hazy sky). No godrays: the light comes from a huge disk, not a point.
	Atmo
	{
		name = Miller
		atmosphereStartRadiusScale = 1
		HR = 3.75
		HM = 1
		m_betaR = 0.007734,0.018,0.057466
		BETA_MSca = 0.1024,0.1024,0.1024
		m_mieG = 0.55
		ozoneAbsorption = 0,0.006355,0.003415
		ozoneHeight = 0
		ozoneFalloff = 10
		useOzone = True
		averageGroundReflectance = 0.1
		multipleScattering = True
		godrayStrength = 0
		flattenScaledSpaceMesh = 0
		rimBlend = 20
		rimpower = 600
		specR = 40
		specG = 40
		specB = 40
		shininess = 50
		noonSunlightExtinctionStrength = 1
		cloudColorMultiplier = 3
		cloudScatteringMultiplier = 0.2
		cloudSkyIrradianceMultiplier = 0.1
		volumetricsColorMultiplier = 1
		EVEIntegration_preserveCloudColors = False
		adjustScaledTexture = False
		scaledLandBrightnessAdjust = 1
		scaledLandContrastAdjust = 1
		scaledLandSaturationAdjust = 1
		scaledOceanBrightnessAdjust = 1
		scaledOceanContrastAdjust = 1
		scaledOceanSaturationAdjust = 1
		configPoints
		{
			Item
			{
				altitude = 0
				skyExposure = 0.12
				skyAlpha = 1
				skyExtinctionTint = 1
				scatteringExposure = 0.12
				extinctionThickness = 1
				postProcessAlpha = 1
				postProcessDepth = 0
				extinctionTint = 1
			}
		}
	}
	// Mann = Kerbin with a paler, colder sky (less Rayleigh, a bit more haze), like the film's glacier.
	Atmo
	{
		name = Mann
		atmosphereStartRadiusScale = 1
		HR = 3.84
		HM = 1
		m_betaR = 0.0100,0.0230,0.0560
		BETA_MSca = 0.020,0.020,0.021
		m_mieG = 0.8
		ozoneAbsorption = 0.000494,0.001429,0.0000645
		ozoneHeight = 20
		ozoneFalloff = 12
		useOzone = True
		averageGroundReflectance = 0.4
		multipleScattering = True
		godrayStrength = 0
		flattenScaledSpaceMesh = 0.6
		rimBlend = 20
		rimpower = 600
		specR = 2
		specG = 2
		specB = 2
		shininess = 50
		noonSunlightExtinctionStrength = 1
		cloudColorMultiplier = 3
		cloudScatteringMultiplier = 0.2
		cloudSkyIrradianceMultiplier = 0.05
		volumetricsColorMultiplier = 1
		EVEIntegration_preserveCloudColors = False
		adjustScaledTexture = False
		scaledLandBrightnessAdjust = 1
		scaledLandContrastAdjust = 1
		scaledLandSaturationAdjust = 1
		scaledOceanBrightnessAdjust = 1
		scaledOceanContrastAdjust = 1
		scaledOceanSaturationAdjust = 1
		configPoints
		{
			Item
			{
				altitude = 0
				skyExposure = 0.2
				skyAlpha = 1
				skyExtinctionTint = 1
				scatteringExposure = 0.2
				extinctionThickness = 1
				postProcessAlpha = 1
				postProcessDepth = 0
				extinctionTint = 1
			}
		}
	}
	// Edmunds = Kerbin with a bit more dust (desert, the film's light blue sky).
	Atmo
	{
		name = Edmunds
		atmosphereStartRadiusScale = 1
		HR = 3.84
		HM = 1
		m_betaR = 0.01534,0.03571,0.08755
		BETA_MSca = 0.016,0.0155,0.015
		m_mieG = 0.82
		ozoneAbsorption = 0.000494,0.001429,0.0000645
		ozoneHeight = 20
		ozoneFalloff = 12
		useOzone = True
		averageGroundReflectance = 0.2
		multipleScattering = True
		godrayStrength = 0.7
		flattenScaledSpaceMesh = 0.6
		rimBlend = 20
		rimpower = 600
		specR = 2
		specG = 2
		specB = 2
		shininess = 50
		noonSunlightExtinctionStrength = 1
		cloudColorMultiplier = 3
		cloudScatteringMultiplier = 0.2
		cloudSkyIrradianceMultiplier = 0.05
		volumetricsColorMultiplier = 1
		EVEIntegration_preserveCloudColors = False
		adjustScaledTexture = False
		scaledLandBrightnessAdjust = 1
		scaledLandContrastAdjust = 1
		scaledLandSaturationAdjust = 1
		scaledOceanBrightnessAdjust = 1
		scaledOceanContrastAdjust = 1
		scaledOceanSaturationAdjust = 1
		configPoints
		{
			Item
			{
				altitude = 0
				skyExposure = 0.2
				skyAlpha = 1
				skyExtinctionTint = 1

// Miller's ocean: real (FFT) waves instead of the flat textured stock ocean.
// Lesson: with strong wind the crest rose above a camera skimming the water and Scatterer switched to
// underwater mode, which with a low darknessDepth and dark colour turned the whole scene black. Hence:
// moderate waves and a light underwater mode (shallow water, ~3 m deep).
Scatterer_ocean:NEEDS[Scatterer]
{
	Ocean
	{
		name = Miller
		AMP = 1
		m_windSpeed = 8
		m_omega = 0.84
		m_gravity = 12.75
		maxWaveInteractionShipAltitude = 500
		m_whiteCapStr = 0.25
		shoreFoam = 1
		m_farWhiteCapStr = -0.15
		// colour of the light coming up from the water: dark grey-green, almost no blue (film)
		m_oceanUpwellingColor = 0.0060,0.0080,0.0075
		m_UnderwaterColor = 0.30,0.38,0.36
		offScreenVertexStretch = 1.25
		alphaRadius = 1000
		transparencyDepth = 30
		darknessDepth = 600
		refractionIndex = 1.33
		skyReflectionStrength = 1
		lightRaysStrength = 0.6
	}
}

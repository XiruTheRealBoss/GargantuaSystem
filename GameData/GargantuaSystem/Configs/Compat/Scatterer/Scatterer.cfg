// Scatterer (opcional): atmosferas com espalhamento real e oceano com ondas em Miller.
// Só é aplicado se o Scatterer (e o pacote de configs dele, que cria os nós raiz) estiver instalado.
// Valores próprios, escolhidos pelas referências do filme:
//   Miller  — céu encoberto cinza (muita névoa Mie neutra), mar cinza-escuro e picado
//   Mann    — céu esbranquiçado e frio (pouco Rayleigh, névoa clara)
//   Edmunds — céu azul de deserto com um pouco de poeira
// O "sol" de Miller e de Mann é o disco de Gargantua; o de Edmunds é Pantagruel.

@Scatterer_planetsList:NEEDS[Scatterer]:FOR[GargantuaSystem]
{
	@scattererCelestialBodies
	{
		Item
		{
			celestialBodyName = Miller
			transformName = Miller
			loadDistance = 100000000
			unloadDistance = 200000000
			hasOcean = True
			flatScaledSpaceModel = True
			usesCloudIntegration = True
			mainSunCelestialBody = Gargantua
			sunColor = 1,0.96,0.90,1
			sunsUseIntensityCurves = False
		}
		Item
		{
			celestialBodyName = Mann
			transformName = Mann
			loadDistance = 100000000
			unloadDistance = 200000000
			hasOcean = False
			flatScaledSpaceModel = False
			usesCloudIntegration = True
			mainSunCelestialBody = Gargantua
			sunColor = 1,0.96,0.90,1
			sunsUseIntensityCurves = False
		}
		Item
		{
			celestialBodyName = Edmunds
			transformName = Edmunds
			loadDistance = 100000000
			unloadDistance = 200000000
			hasOcean = False
			flatScaledSpaceModel = False
			usesCloudIntegration = True
			mainSunCelestialBody = Pantagruel
			sunColor = 1,0.90,0.78,1
			sunsUseIntensityCurves = False
		}
	}
}

// Nó raiz próprio (não patch): "@Scatterer_atmosphere" casaria com o nó de cada arquivo e duplicaria tudo

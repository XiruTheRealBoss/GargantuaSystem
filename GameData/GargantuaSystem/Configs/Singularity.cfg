// Gravitational lensing + accretion disk (visual only; Singularity does not teleport anything).
// Visual horizon radius = sqrt(gravity) * 30000 m  ->  8.7E9 gives ~2.8E9 m (same as the body radius).
// Outer radius < 2.5E10 m: above ~3E10 m Singularity loses precision (LGhassen/Singularity#3).
// We do not define Singularity_config: the first one found applies to the whole game and belongs to Singularity.
Singularity
{
	Singularity_object
	{
		name = Gargantua
		gravity = 8.7E9
		hideCelestialBody = True
		useAccretionDisk = True
		useRadialTextureMapping = True
		// ~28 deg off the orbital plane: Miller (1E10 m, inside the disk radius) only crosses the disk plane for
		// moments; near the plane the disk gets stretched into bands
		accretionDiskNormal = 0.45,1,0.25
		accretionDiskInnerRadius = 3.6E9
		accretionDiskOuterRadius = 2.2E10
		accretionDiskRotationSpeed = -0.3
		accretionDiskTexturePath = GargantuaSystem/PluginData/AccretionDisk.png
		// Lens sphere = scale * sqrt(gravity) * 120 scaled units (1 = 6.7E10 m). Inside it, far from the hole,
		// Singularity tore the sky (pulsar, Mann). 0.8 = 5.4E10 m (with 0.35 and 0.6 the sphere edge clipped the
		// lensed disk image into a circle). The pulsar orbits outside it (NeutronStar.cfg).
		scaleEnclosingMesh = 0.8
	}
}

// Lente gravitacional + disco de acreção (só visual; o Singularity não teleporta nada).
// Raio visual do horizonte = sqrt(gravity) * 30000 m  ->  8.7E9 ≈ 2.8E9 m (igual ao radius do corpo).
// Raio externo < 2.5E10 m: acima de ~3E10 m o Singularity perde precisão (LGhassen/Singularity#3).
// Não definimos Singularity_config: o primeiro encontrado vale para o jogo todo e é do próprio Singularity.
Singularity
{
	Singularity_object
	{
		name = Gargantua
		gravity = 8.7E9
		hideCelestialBody = True
		useAccretionDisk = True
		useRadialTextureMapping = True
		// ~28° fora do plano das órbitas: Miller (1E10 m, dentro do raio do disco) só cruza o plano do disco por
		// instantes; perto do plano o disco fica esticado em faixas
		accretionDiskNormal = 0.45,1,0.25
		accretionDiskInnerRadius = 3.6E9
		accretionDiskOuterRadius = 2.2E10
		accretionDiskRotationSpeed = -0.3
		accretionDiskTexturePath = GargantuaSystem/PluginData/AccretionDisk.png
		scaleEnclosingMesh = 1
	}
}
